services:
  postgres:
    image: postgres:16-alpine
    container_name: financeex-postgres
    environment:
      POSTGRES_DB: financeex
      POSTGRES_USER: fin_supervisor
      POSTGRES_PASSWORD: kunone123
    ports:
      - "5432:5432"
    volumes:
      - financeex-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/001-init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
      - ./src/main/resources/db/init-20260718.sql:/init-20260718.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin_supervisor -d financeex"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: financeex-redis
    command: ["redis-server", "--requirepass", "kunone123", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - financeex-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kunone123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  financeex-postgres-data:
  financeex-redis-data:
