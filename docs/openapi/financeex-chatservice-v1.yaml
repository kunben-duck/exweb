          description: SELECTED_MESSAGES 分享的明确选择消息；SINGLE_TURN 响应省略该字段
          items:
            $ref: '#/components/schemas/ChatShareSelectedMessage'

    ChatShareDelivery:
      type: object
      required: [deliveryId, shareId, provider, status, createdAt, updatedAt]
      properties:
        deliveryId:
          type: string
        shareId:
          type: string
        provider:
          type: string
        status:
          type: string
          enum: [SUCCESS, FAILED]
        linkUrl:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatShareAndDelivery:
      type: object
      required: [share, delivery]
      properties:
        share:
          $ref: '#/components/schemas/ChatShare'
        delivery:
          $ref: '#/components/schemas/ChatShareDelivery'

    UploadedDocument:
      type: object
      required:
        - id
        - tenantId
        - userId
        - originalName
        - bucket
        - objectKey
        - contentType
        - sizeBytes
        - status
        - source
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: string
        sessionId:
          type: string
          nullable: true
        originalName:
          type: string
        bucket:
          type: string
        objectKey:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          example: AVAILABLE
        source:
          type: string
          enum: [LOCAL_UPLOAD, EDM_UPLOAD, S3_UPLOAD]
        metadataJson:
          type: object
          nullable: true
          additionalProperties: true
          description: 已解析的 JSON 对象，可能包含 providerDocument 和 capabilities
        tokenSize:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentLibraryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UploadedDocument'
        nextCursor:
          type: string
          nullable: true

    UpdateDocumentRequest:
      type: object
      properties:
        originalName:
          type: string
          nullable: true
        metadataJson:
          type: string
          nullable: true
          description: 新扩展元数据 JSON 字符串；为空保留原值

    DocumentStatus:
      type: object
      required: [documentId, status]
      properties:
        documentId:
          type: string
        status:
          type: string
        tokenSize:
          type: integer
          format: int64
          nullable: true

    DocumentAccess:
      type: object
      required: [documentId, accessUrl, accessType]
      properties:
        documentId:
          type: string
        accessUrl:
          type: string
        accessType:
          type: string
          enum: [BACKEND_STREAM]
        expiresAt:
          type: string
          format: date-time
          nullable: true

    WebSocketConnectCommand:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          description: 客户端命令 ID，reply/error 原样返回
        type:
          type: string
          enum: [connect]
        presence:
          type: string
          enum: [foreground, background]
          default: foreground
      example:
        id: ws_cmd_001
        type: connect
        presence: foreground

    WebSocketPresenceCommand:
      type: object
      required: [id, type, presence]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [presence]
        presence:
          type: string
          enum: [foreground, background]
      example:
        id: ws_cmd_002
        type: presence
        presence: background

    WebSocketSubscribeCommand:
      type: object
      required: [id, type, topicId]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [subscribe]
        topicId:
          type: string
          example: chat-run-run_002
        afterSeq:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 已实际处理成功的最大 sequence；新 run 通常使用 ChatRunStart.firstSeq
      example:
        id: ws_cmd_003
        type: subscribe
        topicId: chat-run-run_002
        afterSeq: 1042

    WebSocketUnsubscribeCommand:
      type: object
      required: [id, type, topicId]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [unsubscribe]
        topicId:
          type: string
      example:
        id: ws_cmd_004
        type: unsubscribe
        topicId: chat-run-run_002

    ChatWebSocketEnvelope:
      type: object
      required: [type]
      properties:
        id:
          type: string
          nullable: true
        type:
          type: string
          enum: [reply, message, error]
        topicId:
          type: string
          nullable: true
        offset:
          type: string
          nullable: true
          description: stream-item 的全局 sequence 字符串；live-only值不可由Event Resume补发
        payload:
          type: object
          allOf:
            - $ref: '#/components/schemas/ConversationTurnStream'
          nullable: true
        reply:
          type: object
          nullable: true
          additionalProperties: true
        code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
      example:
        type: message
        topicId: chat-run-run_002
        offset: '1043'
        payload:
          type: conversation-turn-stream
          payload:
            type: stream-item
            conversationId: session_001
            turnId: run_002
            streamItemId: seq-1043
            encodedItem:
              encoding: chat-event-json-v1
              event: message.delta
              data:
                runId: run_002
                sessionId: session_001
                sequence: 1043
                type: message.delta
                payload:
                  delta: 本季度
      x-recover-required-example:
        type: error
        topicId: chat-run-run_002
        offset: '1050'
        code: RECOVER_REQUIRED
        message: 实时事件需要恢复，请使用 Event Resume 补齐
        details:
          reason: LIVE_BUFFER_OVERFLOW
          topicId: chat-run-run_002
          recoveryAfterSeq: 1049
          actualSeq: 1050
