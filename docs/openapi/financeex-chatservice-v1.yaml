          type: string
        currentTargetId:
          type: string
        currentRouteSource:
          type: string
          nullable: true
        candidateProvider:
          type: string
        candidateTargetId:
          type: string
        candidateIntentName:
          type: string
          nullable: true
        refusalCode:
          type: string
          nullable: true
        refusalReasonCode:
          type: string
          nullable: true
        refusalRecoverable:
          type: boolean
          nullable: true
        refusalReason:
          type: string
          nullable: true
        originalQuery:
          type: string
          nullable: true
        autoActionAt:
          type: string
          format: date-time
          description: 前端自动同意切换的绝对截止时间
        autoActionTimeoutMs:
          type: integer
          format: int64
        autoActionType:
          type: string
          enum: [APPROVE_ROUTE_SWITCH]
      description: |
        手动来源的 DomainAgent 拒答后，候选目标发生变化且自动切换配置关闭时生成。同一技能、
        自动来源或开启 refusal-auto-switch-enabled 时不生成。截止时间与 AMBIGUOUS_ROUTE 共用配置，
        到期后由前端提交现有 approved=true 请求。

    RelayQuestionnaireCardPayload:
      type: object
      required: [sourceType, approval_id, operation_type, questions]
      properties:
        source:
          type: string
          nullable: true
          example: relay
        sourceType:
          type: string
          enum: [approval-request]
        interactionType:
          type: string
          enum: [AGENT_CLARIFICATION]
          nullable: true
          description: run.waiting_user 中返回；原始 runtime.card 依赖 sourceType/operation_type
        interactionId:
          type: string
          nullable: true
          description: run.waiting_user 中由服务端生成
        assistantMessageId:
          type: string
          nullable: true
        approval_id:
          type: string
        operation_type:
          type: string
          enum: [questionnaire]
        mode:
          type: string
          nullable: true
          enum: [questionnaire]
        message:
          type: string
          nullable: true
        risk_level:
          type: string
          nullable: true
        agent_name:
          type: string
          nullable: true
        parent_instance_id:
          type: string
          nullable: true
        timestamp:
          type: string
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/RelayQuestionnaireQuestion'
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        autoActionAt:
          type: string
          format: date-time
          nullable: true
        autoActionTimeoutMs:
          type: integer
          format: int64
          nullable: true
        autoActionType:
          type: string
          nullable: true
          enum: [IGNORE_QUESTIONNAIRE]
      x-internal-relay-forwarding:
        answer:
          type: approval-response
          request_id: approval_xxx
          approved: true
          scope: once
          questionnaire_answers:
            label:
              请选择技术方案: 方案A
              请选择部署环境: [开发环境, 测试环境]
            ignore: false
        ignore:
          type: approval-response
          request_id: approval_xxx
          approved: false
          scope: once
          questionnaire_answers:
            ignore: true
        notes: |
          run-B 跳过 Intent，使用原 Relay runtimeSessionId 执行 RESUME，等待 session-ready 后发送
          approval-response。request_id 的值来源于入站 approval-request.approval_id；当前协议不发送
          approval_id、metadata 或 timestamp。正常回答由后端补充 questionnaire_answers.ignore=false。

