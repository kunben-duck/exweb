      operationId: createAndDeliverChatShare
      summary: 创建单轮分享并立即发送
      description: Cookie 仅按 provider 配置透传给可信发送适配器。
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/OptionalCookie'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatShareAndDeliveryRequest'
            example:
              title: 本季度利润分析
              expiresAt: '2026-09-01T00:00:00Z'
              provider: welink
              targetAccounts: [u001, u002]
              groupIds: []
              content: 请查收分析结果
              language: zh-CN
      responses:
        '200':
          description: 分享及发送结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatShareAndDelivery'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/chat/shares:
    post:
      tags: [Sharing]
      operationId: createSelectedMessagesChatShare
      summary: 创建多消息固定快照分享
      description: |
        只保存 messageIds 明确选择的 user/assistant 消息，不自动补齐问答对或中间消息。
        所有消息必须属于当前用户、指定会话及同一条 root-to-leaf 分支；响应快照按服务端消息路径排序。
        允许纯 user、纯 assistant 或混合选择，适用于失败后只有 user 消息的轮次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSelectedChatShareRequest'
            examples:
              selectedMessages:
                summary: 选择同一分支上的两条消息
                value:
                  sessionId: session_xxx
                  messageIds: [msg_user_1, msg_assistant_2]
                  title: 财务分析摘录
                  expiresAt: '2026-09-01T00:00:00Z'
              failedUserOnly:
                summary: 分享失败后没有 assistant 的 user 消息
                value:
                  sessionId: session_xxx
                  messageIds: [msg_failed_user]
      responses:
        '200':
          description: scope=SELECTED_MESSAGES 的分享元数据
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatShare'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Sharing]
      operationId: listChatShares
      summary: 查询当前用户创建的分享
      description: |
        仅返回分享元数据，不返回或反序列化固定快照。pageSize 默认20，后端最大限制为100。
        分享详情和发送链路才会按 shareId 读取完整快照。
      parameters:
        - name: curPage
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 分享页码页
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatSharePage'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/chat/shares/{shareId}:
    get:
      tags: [Sharing]
      operationId: getChatShare
      summary: 查询分享固定快照
      parameters:
        - $ref: '#/components/parameters/ShareId'
      responses:
        '200':
          description: 单轮或多消息分享详情；也可能是 ACCESS_DENIED 提示
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatShareDetail'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Sharing]
      operationId: revokeChatShare
      summary: 撤销分享
      parameters:
        - $ref: '#/components/parameters/ShareId'
      responses:
        '200':
          description: REVOKED 分享元数据
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatShare'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/chat/shares/{shareId}/deliveries:
    post:
      tags: [Sharing]
      operationId: deliverChatShare
      summary: 发送已有分享
      parameters:
        - $ref: '#/components/parameters/ShareId'
        - $ref: '#/components/parameters/OptionalCookie'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatShareDeliveryRequest'
            example:
              provider: welink
              targetAccounts: [u001]
              groupIds: [group_001]
              title: 财务分析结果
              content: 请查收
              language: zh-CN
      responses:
        '200':
          description: Provider 发送结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatShareDelivery'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/documents:
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: 上传文件并登记文档资产
      description: |
        Servlet 与 WebFlux 启动模式提供相同外部契约。`metadata` 是 multipart 中的 JSON 字符串，
        不是独立 application/json body。Cookie 仅按 provider 配置透传给可信上传服务。
      parameters:
        - $ref: '#/components/parameters/OptionalCookie'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                sessionId:
                  type: string
                  description: 可选关联会话；服务端校验归属
                metadata:
                  type: string
                  description: JSON object 字符串；api-store 可使用 metadata.skillId 控制上传请求
                  example: '{"skillId":"finance_analysis","source":"chat"}'
      responses:
        '200':
          description: 已登记文档元数据
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UploadedDocument'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: 游标分页查询当前用户文档库
      parameters:
        - name: sessionId
          in: query
          required: false
          description: 只查询关联到指定会话的文档
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 文档库游标页
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DocumentLibraryPage'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/documents/{documentId}:
    get:
      tags: [Documents]
      operationId: getDocument
      summary: 查询文档元数据
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          $ref: '#/components/responses/UploadedDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Documents]
      operationId: updateDocument
      summary: 更新文档展示名称或扩展元数据
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
            example:
              originalName: 经营分析报告.pdf
              metadataJson: '{"category":"finance"}'
      responses:
        '200':
          $ref: '#/components/responses/UploadedDocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: 软删除文档
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          $ref: '#/components/responses/UploadedDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/documents/{documentId}/status:
    get:
      tags: [Documents]
      operationId: getDocumentStatus
      summary: 查询文档处理状态
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: 文档状态
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DocumentStatus'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/documents/{documentId}/preview-url:
    get:
      tags: [Documents]
      operationId: getDocumentPreviewUrl
      summary: 获取后端受控预览地址
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: 当前实现返回 BACKEND_STREAM 地址
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DocumentAccess'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/documents/{documentId}/download:
    get:
      tags: [Documents]
      operationId: downloadDocument
      summary: 鉴权并流式下载文档
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: 文档二进制内容；Content-Disposition 为 attachment
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 带服务端可信文件名的 attachment 响应头
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    OptionalCookie:
      name: Cookie
      in: header
      required: false
      description: |
        可选的原始 Cookie 请求头，仅作为内存快照透传给可信下游。不得复制到 body、metadata、
        URL、事件或日志。身份认证方式仍由企业网关或企业框架决定。
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    AfterSeq:
      name: afterSeq
      in: query
      required: false
      description: 已实际处理成功的最大 ChatEvent.sequence；只返回大于该值的事件
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    AppIdQuery:
      name: appId
      in: query
      required: false
      description: 应用标识；trim 后为空表示不筛选，使用区分大小写的精确匹配
      schema:
        type: string
        maxLength: 128
        example: fund-app
    AppScopeQuery:
      name: appScope
      in: query
      required: false
      description: 会话 App 范围；MAIN_SITE 仅查询 app_id IS NULL 的主站会话，不能同时指定 appId；省略时保持现有全量语义
      schema:
        type: string
        enum: [MAIN_SITE]
        example: MAIN_SITE
    SessionTitleQuery:
      name: title
      in: query
      required: false
      description: 会话标题包含搜索；trim 后为空表示不筛选，英文大小写不敏感，%/_/! 按普通字符处理
      schema:
        type: string
        maxLength: 256
        example: 利润
    SessionKeywordQuery:
      name: keyword
      in: query
      required: false
      description: 标题、已持久化user问题和assistant回答的统一包含搜索；trim后为空表示不筛选，%/_/!按普通字符处理
      schema:
        type: string
        minLength: 2
        maxLength: 128
        example: 资产负债率
    SessionChannelQuery:
      name: channel
      in: query
      required: false
      description: 会话来源渠道；trim 后为空表示不筛选，使用区分大小写的精确匹配；移动端统一传 mobile
      schema:
        type: string
        maxLength: 64
        example: mobile

  responses:
    BadRequest:
      description: 参数错误或 Bean Validation 失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            badRequest:
              value:
                timestamp: '2026-08-01T10:00:00Z'
                path: /v1/chat/runs
                status: 400
                error: Bad Request
                code: BAD_REQUEST
                message: 用户消息不能为空
            validationFailed:
              value:
                timestamp: '2026-08-01T10:00:00Z'
                path: /v1/chat/runs
                status: 400
                error: Bad Request
                code: VALIDATION_FAILED
                message: 'message: message 长度不能超过 20000'
    Unauthorized:
      description: 企业身份上下文缺失
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: '2026-08-01T10:00:00Z'
            path: /v1/chat/runs
            status: 401
            error: Unauthorized
            code: AUTH_CONTEXT_MISSING
            message: 用户身份上下文缺失
    SessionSearchTimeout:
      description: 会话关键字搜索超过数据库查询预算
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            timestamp: '2026-08-26T10:00:00Z'
            path: /v1/chat/sessions/page
            status: 503
            error: Service Unavailable
            code: SESSION_SEARCH_TIMEOUT
            message: 会话关键字搜索超时，请稍后重试
    Conflict:
      description: |
        资源状态冲突。常见 code 包括 ACTIVE_RUN_EXISTS、INTERACTION_ALREADY_HANDLED、
        INTERACTION_EXPIRED、CONFLICT 以及分享状态冲突码。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            activeRun:
              value:
                timestamp: '2026-08-01T10:00:00Z'
                path: /v1/chat/runs
                status: 409
                error: Conflict
                code: ACTIVE_RUN_EXISTS
                message: 当前会话已有运行中的任务
            interactionHandled:
              value:
                timestamp: '2026-08-01T10:00:00Z'
                path: /v1/chat/runs
                status: 409
                error: Conflict
                code: INTERACTION_ALREADY_HANDLED
                message: 当前交互已被处理
    ConversationTurnStreamResponse:
      description: |
        SSE event name 固定为 `conversation-turn-stream`。每个 data 是 ConversationTurnStream；
        只有 `payload.type=stream-item` 携带 ChatEvent。stream-item 可能是持久化事实，也可能是在
        `ASSISTANT_PLACEHOLDER` 策略下仅实时传输的业务 Event；heartbeat/done 不推进 afterSeq。
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-cache
        X-Accel-Buffering:
          schema:
            type: string
            example: 'no'
      content:
        text/event-stream:
          schema:
            $ref: '#/components/schemas/ConversationTurnStream'
          examples:
            streamItem:
              value:
                type: conversation-turn-stream
                payload:
                  type: stream-item
                  conversationId: session_001
                  turnId: run_002
                  streamItemId: seq-1043
                  serverTimestampMs: 1785578400000
                  encodedItem:
                    encoding: chat-event-json-v1
                    event: message.delta
                    data:
                      runId: run_002
                      sessionId: session_001
                      sequence: 1043
                      type: message.delta
                      payload:
                        delta: 本季度
            intentClarificationWaiting:
              $ref: '#/components/examples/IntentClarificationWaitingEvent'
            ambiguousRouteCard:
              $ref: '#/components/examples/AmbiguousRouteCardEvent'
            routeSwitchConfirmation:
              $ref: '#/components/examples/RouteSwitchConfirmationEvent'
            relayQuestionnaireCard:
              $ref: '#/components/examples/RelayQuestionnaireCardEvent'
    ChatSessionResponse:
      description: 会话快照；也可能是 HTTP 200/ACCESS_DENIED 提示
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ChatSession'
              - $ref: '#/components/schemas/ApiErrorResponse'
    UploadedDocumentResponse:
      description: 文档元数据；也可能是 HTTP 200/ACCESS_DENIED 提示
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/UploadedDocument'
              - $ref: '#/components/schemas/ApiErrorResponse'

  examples:
    AccessDenied:
      summary: 当前实现的资源不可访问兼容响应
      value:
        timestamp: '2026-08-01T10:00:00Z'
        path: /v1/chat/runs
        status: 200
        error: OK
        code: ACCESS_DENIED
        message: 当前数据不可访问或已不存在
    IntentClarificationWaitingEvent:
      summary: 普通 Intent 澄清进入 WAITING_USER
      value:
        type: conversation-turn-stream
        payload:
          type: stream-item
          conversationId: session_001
          turnId: run_A
          streamItemId: seq-2001
          encodedItem:
            encoding: chat-event-json-v1
            event: run.waiting_user
            data:
              runId: run_A
              sessionId: session_001
              sequence: 2001
              type: run.waiting_user
              payload:
                status: WAITING_USER
                interactionType: INTENT_CLARIFICATION
                interactionId: interaction_intent_001
                assistantMessageId: msg_assistant_clarify_001
                feedbackTargetMessageId: msg_assistant_clarify_001
                messageReady: true
                expiresAt: '2026-08-02T10:00:00Z'
    AmbiguousRouteCardEvent:
      summary: AMBIGUOUS_ROUTE 候选卡片
      value:
        type: conversation-turn-stream
        payload:
          type: stream-item
          conversationId: session_001
          turnId: run_A
          streamItemId: seq-2010
          encodedItem:
            encoding: chat-event-json-v1
            event: runtime.card
            data:
              runId: run_A
              sessionId: session_001
              sequence: 2010
              type: runtime.card
              payload:
                source: intent-agent
                sourceType: intent-clarification-request
                routeAction: CLARIFY
                clarificationType: AMBIGUOUS_ROUTE
                clarifyQuestion: 请选择要使用的技能
                candidateIntents:
                  - intentId: domain_agent_finance_data_query
                    intentName: 财经智能问数
                    confidence: 0.86
                    accessName: domain_agent_finance_data_query
                    skillId: finance_data_query
                    resourceInstruction:
                      resourceId: resource_finance_data_query
                  - intentId: domain_agent_finance_knowledge
                    intentName: 财经知识助手
                    confidence: 0.81
                    accessName: domain_agent_finance_knowledge
                    skillId: finance_knowledge
                    resourceInstruction:
                      resourceId: resource_finance_knowledge
                actions:
                  - type: AUTO_SELECT
                    displayName: 代为选择
                  - type: OTHER
                    displayName: 其他
                autoSelectAt: '2026-08-01T10:00:30Z'
                autoSelectTimeoutMs: 30000
    RouteSwitchConfirmationEvent:
      summary: DomainAgent 拒答后请求确认切换
      value:
        type: conversation-turn-stream
        payload:
          type: stream-item
          conversationId: session_001
          turnId: run_A
          streamItemId: seq-2020
          encodedItem:
            encoding: chat-event-json-v1
            event: runtime.card
            data:
              runId: run_A
              sessionId: session_001
              sequence: 2020
              type: runtime.card
              payload:
                source: chatservice
                sourceType: route-switch-confirmation-request
                interactionType: ROUTE_SWITCH_CONFIRMATION
                currentProvider: domain-agent
                currentTargetId: document_agent
                currentRouteSource: front-selected
                candidateProvider: domain-agent
                candidateTargetId: finance_knowledge
                candidateIntentName: 财经知识助手
                refusalCode: FN-EX-CHAT-BIZ-DAG-001
                refusalReason: 当前请求不属于该技能处理范围
                originalQuery: 帮我解释这个财经指标
                autoActionAt: '2026-08-05T10:00:30Z'
                autoActionTimeoutMs: 30000
                autoActionType: APPROVE_ROUTE_SWITCH
    RelayQuestionnaireCardEvent:
      summary: Relay 返回单选和多选问卷卡片
      value:
        type: conversation-turn-stream
        payload:
          type: stream-item
          conversationId: session_001
          turnId: run_relay_A
          streamItemId: seq-2030
          encodedItem:
            encoding: chat-event-json-v1
            event: runtime.card
            data:
              runId: run_relay_A
              sessionId: session_001
              sequence: 2030
              type: runtime.card
              payload:
                source: relay
                sourceType: approval-request
                approval_id: approval_001
                operation_type: questionnaire
                mode: questionnaire
                message: Please answer the following questions
                risk_level: LOW
                parent_instance_id: relay_session_001
                questions:
                  - question: 请选择技术方案
                    options:
                      - label: 方案A
                        description: 使用 REST API
                      - label: 方案B
                        description: 使用 GraphQL
                    multi_select: false
                  - question: 请选择部署环境
                    options:
                      - label: 开发环境
                      - label: 测试环境
                    multi_select: true
                autoActionAt: '2026-08-01T10:01:00Z'
                autoActionTimeoutMs: 60000
                autoActionType: IGNORE_QUESTIONNAIRE

  schemas:
    ApiErrorResponse:
      type: object
      required: [timestamp, status, error, code, message]
      properties:
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
        error:
          type: string
        code:
          type: string
        message:
          type: string

    IntentCandidateQueryRequest:
      type: object
      required: [messageId]
      additionalProperties: false
      properties:
        messageId:
          type: string
          minLength: 1
          maxLength: 64
          description: 当前用户拥有的user消息ID；服务端trim后校验长度

    IntentCandidateQueryItem:
      type: object
      required: [intentId, accessName, skillId, intentName, confidence]
      properties:
        intentId:
          type: string
          nullable: true
        accessName:
          type: string
          nullable: true
          description: Intent服务返回的原始accessName
        skillId:
          type: string
          nullable: true
          description: 按通用响应前缀区分大小写移除一次并trim后的accessName
        intentName:
          type: string
          nullable: true
        confidence:
          type: number
          format: double
          nullable: true

    IntentPreferenceCorrectionRequest:
      type: object
      required: [selectionType]
      additionalProperties: false
      properties:
        selectionType:
          type: string
          minLength: 1
          maxLength: 32
          enum: [INTENT_CANDIDATE, AMBIGUOUS_ROUTE]
        sourceMessageId:
          type: string
          maxLength: 64
          nullable: true
          description: INTENT_CANDIDATE必填；必须是当前用户拥有的user消息
        selectedIntent:
          type: object
          allOf:
            - $ref: '#/components/schemas/ChatSelectedIntent'
          nullable: true
          description: INTENT_CANDIDATE必填；AMBIGUOUS_ROUTE不得提交
        interactionId:
          type: string
          maxLength: 64
          nullable: true
          description: AMBIGUOUS_ROUTE必填；必须指向已成功受理或已完成人工候选选择的Interaction
        intentAccessName:
          type: string
          maxLength: 128
          nullable: true
          description: 偏好隔离使用的Intent入口；空白或未传时使用服务端默认值，区分大小写

    DomainAgentAsyncTaskCallbackRequest:
      type: object
      required: [runId, status]
      properties:
        runId:
          type: string
          minLength: 1
          maxLength: 64
          description: ChatService调用DomainAgent时提供的可信runId
        status:
          type: string
          enum: [COMPLETED, FAILED]
        resultMode:
          type: string
          nullable: true
          enum: [APPEND, REPLACE]
          description: frames非空时必填
        frames:
          type: array
          maxItems: 512
          nullable: true
          items:
            type: object
            additionalProperties: true
          description: DomainAgent标准响应帧；总序列化大小默认不超过4MiB
        error:
          type: object
          nullable: true
          additionalProperties: true

    DomainAgentAsyncTaskCallbackResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: false表示Run已终态、已取消、已超时或回调已被其他请求提交

    CreateChatRunRequest:
      type: object
      description: |
        统一 Run 请求。字段组合由 runMode 和 Interaction 类型共同约束；OpenAPI 结构保留全部可选字段，
        具体组合必须遵循 operation examples 和下方 x-interaction-rules。
      properties:
        commandId:
          type: string
          maxLength: 128
          nullable: true
        sessionId:
          type: string
          maxLength: 64
          nullable: true
          description: 可为空以由服务端创建会话
        conversationId:
          type: string
          maxLength: 64
          nullable: true
        message:
          type: string
          maxLength: 20000
          nullable: true
          description: NEXT 有有效附件时可为空；同时未传sessionId时，可信附件名去除最后扩展名后作为新会话初始标题；EDIT_USER仍要求非空
        intentAccessName:
          type: string
          maxLength: 128
          nullable: true
          description: 可选Intent入口名称；trim后非空时覆盖本次Intent请求的服务端默认值，未传或空白时回退financeex.intent.access-name。仅进入Intent请求，不进入metadata或Runtime请求；Interaction续接不继承source run值。
        runMode:
          type: string
          maxLength: 32
          nullable: true
          default: NEXT
          enum: [NEXT, EDIT_USER, REGENERATE_ASSISTANT, CONTINUE_INTERACTION]
        parentMessageId:
          type: string
          maxLength: 64
          nullable: true
        editedMessageId:
          type: string
          maxLength: 64
          nullable: true
        regeneratedMessageId:
          type: string
          maxLength: 64
          nullable: true
        forceReroute:
          type: boolean
          nullable: true
          default: false
          description: 仅 NEXT 使用；直接重新调用 Intent，不自动产生二次确认
        interactionId:
          type: string
          maxLength: 64
          nullable: true
        approved:
          type: boolean
          nullable: true
        scope:
          type: string
          maxLength: 32
          nullable: true
          example: once
        questionnaireAnswers:
          type: object
          nullable: true
          maxProperties: 50
          additionalProperties: true
        attachments:
          type: array
          nullable: true
          maxItems: 20
          items:
            $ref: '#/components/schemas/ChatAttachment'
        targetType:
          type: string
          maxLength: 32
          nullable: true
          enum: [DOMAIN_AGENT]
        targetId:
          type: string
          maxLength: 128
          nullable: true
        selectedIntent:
          type: object
          allOf:
            - $ref: '#/components/schemas/ChatSelectedIntent'
          nullable: true
        metadata:
          type: object
          nullable: true
          maxProperties: 50
          properties:
            bizContext:
              $ref: '#/components/schemas/ChatBizContext'
          additionalProperties: true
          description: |
            本轮业务扩展字段，不得包含 Cookie、Token、traceId 或其他凭据。`bizContext`用于描述
            当前应用服务和页面业务上下文，不表示浏览器、操作系统或部署环境。
        appId:
          type: string
          maxLength: 128
          nullable: true
        appName:
          type: string
          maxLength: 256
          nullable: true
          description: 存在时必须同时提交 appId
        agentMode:
          type: object
          allOf:
            - $ref: '#/components/schemas/ChatAgentMode'
          nullable: true
          description: 仅记录到当前 DomainAgent Binding；不继承、不转换、不传给下游
        interactionAction:
          type: string
          maxLength: 32
          nullable: true
          enum: [AUTO_SELECT]
        language:
          type: string
          maxLength: 32
          nullable: true
          default: zh_CN
          description: |
            会话标题总结语言，中文使用 zh_CN，英文使用 en_US。服务端 trim 后为空时使用配置的默认语言；该字段不进入 metadata、
            IntentAgent、DomainAgent 或 Relay 请求，也不影响本轮路由和回答。
        channel:
          type: string
          maxLength: 64
          nullable: true
          description: |
            会话来源渠道。自动创建会话时保存该值，未传时默认 web；已有会话中显式提交时必须与
            会话原值完全一致，CONTINUE_INTERACTION 同样在 claim 前校验。PC 端省略该字段，
            移动端统一提交小写 mobile。
      x-interaction-rules:
        ordinaryIntentClarification: questionnaireAnswers 或有效 attachments；不得提交 message。
        ambiguousCandidate: targetType=DOMAIN_AGENT 且 targetId 必须精确匹配服务端候选 skillId。
        ambiguousAutoSelect: interactionAction=AUTO_SELECT，不能同时提交 target、答案或附件。
        ambiguousOther: questionnaireAnswers 或有效 attachments，重新调用 Intent。
        routeSwitchConfirmation: approved=true/false，不提交 target、答案、附件或 interactionAction。
        relayQuestionnaire: questionnaireAnswers.label 或 questionnaireAnswers.ignore=true，二者互斥。

    ChatBizContext:
      type: object
      nullable: true
      description: |
        用户发起本轮问题时所在的业务应用与页面上下文。字段均为可选扩展信息，ChatService当前不增加
        内容校验；每个需要下游使用该上下文的run都应显式提交。
      properties:
        contextVersion:
          type: integer
          format: int32
          example: 1
          description: bizContext结构版本，当前使用1
        application:
          type: object
          nullable: true
          additionalProperties: true
          properties:
            appId:
              type: string
              nullable: true
              example: com.huawei.finance.front.one
              description: 应用服务稳定标识；不会从请求顶层appId自动复制
            name:
              type: string
              nullable: true
              example: 财经作业平台
            description:
              type: string
              nullable: true
              example: 面向财经作业人员的业务系统
        page:
          type: object
          nullable: true
          additionalProperties: true
          properties:
            pageId:
              type: string
              nullable: true
              example: country-cfo-summary
              description: 页面稳定标识
            name:
              type: string
              nullable: true
              example: 事项进展总结
            description:
              type: string
              nullable: true
              example: 用于生成事项总结结论
      additionalProperties: true

    ChatAttachment:
      type: object
      properties:
        documentId:
          type: string
          maxLength: 64
          nullable: true
          description: 服务端唯一信任并重新校验的文档资产 ID
        name:
          type: string
          maxLength: 255
          nullable: true
          description: 前端展示值；不作为可信文件名
        contentType:
          type: string
          maxLength: 128
          nullable: true
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        tokenSize:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        source:
          type: string
          maxLength: 64
          nullable: true

    ChatSelectedIntent:
      type: object
      required: [intentName]
      properties:
        intentId:
          type: string
          maxLength: 128
          nullable: true
        intentName:
          type: string
          minLength: 1
          maxLength: 256
      description: 在Run请求中仅用于显式直连DomainAgent的展示摘要；在偏好接口中表示用户选择的Intent。均不参与服务端路由判断。

    ChatAgentMode:
      type: object
      required: [selections]
      properties:
        selections:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ChatAgentModeSelection'
      description: 空 selections 表示显式清除当前 DomainAgent Binding 中的记录。

    ChatAgentModeSelection:
      type: object
      required: [scheme, code]
      properties:
        scheme:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          maxLength: 256
          nullable: true

    ChatRunStart:
      type: object
      required: [runId, sessionId, firstSeq, createdAt, streamTopicId]
      properties:
        runId:
          type: string
        sessionId:
          type: string
        firstSeq:
          type: integer
          format: int64
          description: 已由创建请求消费的首个持久化事件 sequence
        createdAt:
          type: string
          format: date-time
        streamTopicId:
          type: string
          description: WebSocket subscribe 使用的 topic，当前格式为 chat-run-{runId}

    ChatRunStop:
      type: object
      required:
        - runId
        - sessionId
        - status
        - latestSeq
        - stoppedAt
        - messageReady
        - waitingUserInput
      properties:
        runId:
          type: string
          description: 请求 URL 中的 runId；等待态下通常为 source run-A
        sessionId:
          type: string
        status:
          type: string
          description: 运行态通常为 CANCELLED；等待源 run-A 保持 WAITING_USER
        latestSeq:
          type: integer
          format: int64
        stoppedAt:
          type: string
          format: date-time
        messageReady:
          type: boolean
        assistantMessageId:
          type: string
          nullable: true
        feedbackTargetMessageId:
          type: string
          nullable: true
        waitingUserInput:
          type: boolean
        interactionId:
          type: string
          nullable: true
          description: 等待请求ID；复用原assistant的active continuation同样返回
        interactionStatus:
          type: string
          nullable: true
          enum: [WAITING, RESPONDING, ANSWERED, CANCELLED, EXPIRED]
        interactionCancelledAt:
          type: string
          format: date-time
          nullable: true
        effectiveRunId:
          type: string
          nullable: true
          description: 等待正在切换到 continuation run 时实际停止的 run-B

    ChatStreamStatus:
      type: object
      required: [sessionId, latestSeq, cancellable, waitingUserInput]
      properties:
        sessionId:
          type: string
        latestSeq:
          type: integer
          format: int64
        activeRunId:
          type: string
          nullable: true
        activeRunStatus:
          type: string
          nullable: true
        activeStreamTopicId:
          type: string
          nullable: true
        activeRunFirstSeq:
          type: integer
          format: int64
          nullable: true
        activeRunLastSeq:
          type: integer
          format: int64
          nullable: true
        cancellable:
          type: boolean
        waitingUserInput:
          type: boolean
        waitingSourceRunId:
          type: string
          nullable: true
          description: 等待态统一 stop 使用的 source run-A
        interactionId:
          type: string
          nullable: true
        interactionType:
          type: string
          nullable: true
          enum:
            - CLARIFICATION
            - AGENT_CLARIFICATION
            - INTENT_CLARIFICATION
            - APPROVAL
            - CONFIRMATION
            - ROUTE_SWITCH_CONFIRMATION
        assistantMessageId:
          type: string
          nullable: true
          description: 等待卡片或复用原assistant的active continuation所关联的assistant消息ID
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Interaction 有效期，访问时检查；默认约 24 小时
        autoSelectAt:
          type: string
          format: date-time
          nullable: true
          description: AMBIGUOUS_ROUTE 前端触发 AUTO_SELECT 的建议绝对时间
        autoSelectTimeoutMs:
          type: integer
          format: int64
          nullable: true
        autoActionAt:
          type: string
          format: date-time
          nullable: true
          description: Relay 问卷忽略或路由切换自动同意的建议绝对时间
        autoActionTimeoutMs:
          type: integer
          format: int64
          nullable: true
        autoActionType:
          type: string
          nullable: true
          enum: [IGNORE_QUESTIONNAIRE, APPROVE_ROUTE_SWITCH]
        bindingProvider:
          type: string
          nullable: true
        bindingTargetType:
          type: string
          nullable: true
        bindingTargetId:
          type: string
          nullable: true
        bindingIntentCode:
          type: string
          nullable: true
        bindingIntentName:
          type: string
          nullable: true
        bindingRouteSource:
          type: string
          nullable: true
        bindingUpdatedAt:
          type: string
          format: date-time
          nullable: true
        bindingAgentMode:
          type: object
          allOf:
            - $ref: '#/components/schemas/ChatAgentMode'
          nullable: true
          description: 仅当前 active DomainAgent Binding 有合法记录时返回
        activeRunPhase:
          type: string
          nullable: true
          enum: [ASYNC_RUNNING]
          description: DomainAgent后台任务等待阶段；普通active run为空
        asyncExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: DomainAgent后台任务等待截止时间

    ConversationTurnStream:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [conversation-turn-stream]
        payload:
          $ref: '#/components/schemas/ConversationTurnStreamPayload'

    ConversationTurnStreamPayload:
      type: object
      required: [type, conversationId, turnId]
      properties:
        type:
          type: string
          enum: [stream-item, heartbeat, done]
        conversationId:
          type: string
          description: 当前等于 sessionId
        turnId:
          type: string
          description: 当前等于 runId
        streamItemId:
          type: string
          nullable: true
        serverTimestampMs:
          type: integer
          format: int64
          nullable: true
          description: 传输片段生成时间；不是 ChatEvent.createdAt
        encodedItem:
          type: object
          allOf:
            - $ref: '#/components/schemas/EncodedChatEventItem'
          nullable: true
          description: 仅 stream-item 存在
        lastSeq:
          type: integer
          format: int64
          nullable: true
          description: heartbeat/done 看到的最近持久化 sequence；不推进客户端游标
        terminalEventType:
          type: string
          nullable: true
          description: done 对应的 run.completed/run.failed/run.cancelled 等终态

    EncodedChatEventItem:
      type: object
      required: [encoding, event, data]
      properties:
        encoding:
          type: string
          enum: [chat-event-json-v1]
        event:
          type: string
          description: 与 data.type 相同
        data:
          $ref: '#/components/schemas/ChatEvent'

    ChatEvent:
      type: object
      required: [runId, sessionId, sequence, type, payload]
      properties:
        runId:
          type: string
        sessionId:
          type: string
        sequence:
          type: integer
          format: int64
          description: 数据库全局 sequence；live-only业务 Event 也会分配，但不能作为可恢复事实
        type:
          type: string
          example: message.delta
        payload:
          anyOf:
            - $ref: '#/components/schemas/RunAsyncRunningPayload'
            - $ref: '#/components/schemas/RunWaitingUserPayload'
            - $ref: '#/components/schemas/AmbiguousRouteCardPayload'
            - $ref: '#/components/schemas/RouteSwitchConfirmationPayload'
            - $ref: '#/components/schemas/RelayQuestionnaireCardPayload'
            - type: object
              additionalProperties: true
      description: |
        标准聊天事件。默认是数据库事实；`ASSISTANT_PLACEHOLDER` 策略下的业务内容 Event 仅实时传输，
        控制和终态仍是数据库事实。payload 由 type 决定；WAIT 相关主要 payload schema 见本定义的
        RunWaitingUserPayload、AmbiguousRouteCardPayload、RouteSwitchConfirmationPayload 和
        RelayQuestionnaireCardPayload。

    RunAsyncRunningPayload:
      type: object
      required: [source, sourceType, status, messageReady, assistantMessageId, expiresAt]
      properties:
        source:
          type: string
          enum: [domain-agent]
        sourceType:
          type: string
          enum: [agent.async_started]
        status:
          type: string
          enum: [ASYNC_RUNNING]
        message:
          type: string
          nullable: true
        messageReady:
          type: boolean
        assistantMessageId:
          type: string
        feedbackTargetMessageId:
          type: string
        expiresAt:
          type: string
          format: date-time

    RunWaitingUserPayload:
      type: object
      required: [status, interactionId, assistantMessageId, interactionType, expiresAt]
      properties:
        status:
          type: string
          enum: [WAITING_USER]
        interactionId:
          type: string
        assistantMessageId:
          type: string
        feedbackTargetMessageId:
          type: string
          nullable: true
        messageReady:
          type: boolean
        interactionType:
          type: string
          enum:
            - CLARIFICATION
            - AGENT_CLARIFICATION
            - INTENT_CLARIFICATION
            - APPROVAL
            - CONFIRMATION
            - ROUTE_SWITCH_CONFIRMATION
        clarificationType:
          type: string
          nullable: true
          example: AMBIGUOUS_ROUTE
        expiresAt:
          type: string
          format: date-time
        autoSelectAt:
          type: string
          format: date-time
          nullable: true
        autoSelectTimeoutMs:
          type: integer
          format: int64
          nullable: true
        autoActionAt:
          type: string
          format: date-time
          nullable: true
        autoActionTimeoutMs:
          type: integer
          format: int64
          nullable: true
        autoActionType:
          type: string
          nullable: true
          enum: [IGNORE_QUESTIONNAIRE, APPROVE_ROUTE_SWITCH]

    IntentCandidate:
      type: object
      properties:
        intentId:
          type: string
          nullable: true
        intentName:
          type: string
          nullable: true
        confidence:
          type: number
          format: double
          nullable: true
        accessName:
          type: string
          nullable: true
        skillId:
          type: string
          nullable: true
          description: 指定候选时提交为 targetId 的服务端规范化技能 ID
        resourceInstruction:
          type: object
          nullable: true
          additionalProperties: true

    AmbiguousRouteAction:
      type: object
      required: [type, displayName]
      properties:
        type:
          type: string
          enum: [AUTO_SELECT, OTHER]
        displayName:
          type: string

    AmbiguousRouteCardPayload:
      type: object
      required:
        - source
        - sourceType
        - routeAction
        - clarificationType
        - candidateIntents
        - actions
      properties:
        source:
          type: string
          enum: [intent-agent]
        sourceType:
          type: string
          enum: [intent-clarification-request]
        routeAction:
          type: string
          enum: [CLARIFY]
        clarificationType:
          type: string
          enum: [AMBIGUOUS_ROUTE]
        clarifyQuestion:
          type: string
          nullable: true
        candidateIntents:
          type: array
          items:
            $ref: '#/components/schemas/IntentCandidate'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AmbiguousRouteAction'
        autoSelectAt:
          type: string
          format: date-time
          nullable: true
          description: 仅存在至少一个有效 skillId、能够自动选择时返回
        autoSelectTimeoutMs:
          type: integer
          format: int64
          nullable: true
      example:
        source: intent-agent
        sourceType: intent-clarification-request
        routeAction: CLARIFY
        clarificationType: AMBIGUOUS_ROUTE
        clarifyQuestion: 请选择要使用的技能
        candidateIntents:
          - intentId: domain_agent_finance_data_query
            intentName: 财经智能问数
            confidence: 0.86
            accessName: domain_agent_finance_data_query
            skillId: finance_data_query
            resourceInstruction:
              resourceId: resource_finance_data_query
          - intentId: domain_agent_finance_knowledge
            intentName: 财经知识助手
            confidence: 0.81
            accessName: domain_agent_finance_knowledge
            skillId: finance_knowledge
            resourceInstruction:
              resourceId: resource_finance_knowledge
        actions:
          - type: AUTO_SELECT
            displayName: 代为选择
          - type: OTHER
            displayName: 其他
        autoSelectAt: '2026-08-01T10:00:30Z'
        autoSelectTimeoutMs: 30000

    RouteSwitchConfirmationPayload:
      type: object
      required:
        - interactionType
        - currentProvider
        - currentTargetId
        - candidateProvider
        - candidateTargetId
      properties:
        interactionType:
          type: string
          enum: [ROUTE_SWITCH_CONFIRMATION]
        interactionId:
          type: string
          nullable: true
          description: 在 run.waiting_user 中由服务端补齐；原始 runtime.card 可没有
        assistantMessageId:
          type: string
          nullable: true
