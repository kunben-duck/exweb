openapi: 3.0.3
info:
  title: FinanceEX ChatService API
  version: 1.0.0
  description: |
    FinanceEX ChatService 当前公开业务接口的 OpenAPI 3.0.3 定义。

    本文档以当前代码实现为准，覆盖聊天 Run、会话与消息、流式恢复、反馈、分享、文档和
    WebSocket 实时订阅。除显式列出的 DomainAgent 异步任务回调外，Actuator 以及 IntentAgent、
    DomainAgent、Relay 的其他内部服务接口不属于公开 API。

    所有接口依赖企业网关或企业框架在服务端建立身份上下文。本文档不约定或虚构固定的身份
    Header。资源不存在或不属于当前用户时，当前实现可能返回 HTTP 200 和
    `ApiErrorResponse.code=ACCESS_DENIED`，调用方必须同时检查响应体结构。

    `Cookie` 仅在标注的入口作为请求头内存透传给可信下游。不得把 Cookie、Token 或其他凭据
    放入请求 body、metadata、事件、URL 或日志。
servers:
  - url: /
    description: 当前部署根路径；可由网关 context path 统一前置
security: []
tags:
  - name: Chat Runs & Streaming
    description: Run 创建、停止、WAIT 续接、SSE 恢复和实时状态
  - name: Chat Sessions & Messages
    description: 会话生命周期、消息历史、消息树和分支
  - name: Feedback
    description: Assistant 消息反馈
  - name: Sharing
    description: 单轮问答快照分享及发送
  - name: Documents
    description: 文档上传、文档库、预览和下载
  - name: Realtime WebSocket
    description: Run topic 的实时订阅协议
  - name: Internal DomainAgent
    description: 仅允许企业网关ACL内的DomainAgent调用

x-enterprise-authentication:
  description: |
    身份由企业网关或企业框架在进入 Controller 前建立。请求体不得提交 tenantId、userId 或
    employeeNumber。身份上下文缺失返回 401/AUTH_CONTEXT_MISSING；资源越权按当前兼容语义
    可能返回 HTTP 200/ACCESS_DENIED。
x-sequence-rules:
  description: |
    ChatEvent.sequence 是数据库生成的全局 BIGINT 序号，单调但不保证连续。客户端只能记录
    已成功处理的最大 sequence，并以 `(sessionId, sequence)` 去重；不得用 `seq + 1` 判断丢包。
x-wait-time-semantics:
  expiresAt: >-
    Interaction 的业务有效期，由 financeex.chat-interaction.default-expire-duration 配置，当前默认 24 小时；
    访问时检查，并非后台定时任务。
  autoSelectAt: >-
    AMBIGUOUS_ROUTE 的前端建议代选时间，由 financeex.intent.ambiguous-route-wait-timeout 配置，当前默认
    30 秒；由前端触发 AUTO_SELECT，后端不注册定时任务。
  autoActionAt: >-
    通用前端自动动作时间。Relay 问卷由 financeex.relay.questionnaire-wait-timeout 配置；
    ROUTE_SWITCH_CONFIRMATION 与 AMBIGUOUS_ROUTE 共用 financeex.intent.ambiguous-route-wait-timeout。
    后端只返回时间事实，不注册定时任务。
  routeSwitchConfirmation: >-
    ROUTE_SWITCH_CONFIRMATION 到期后前端提交 approved=true，自动同意切换到候选 Runtime。
x-websocket:
  url: /v1/chat/ws
  tag: Realtime WebSocket
  description: |
    WebSocket 仅承载实时扇出和订阅控制，不是事件事实源。连接建立后先发送 `connect`，再按
    `streamTopicId` 发送 `subscribe`。服务端 `message.payload` 与 SSE 的
    `ConversationTurnStream` 完全一致。真实 ChatEvent 位于
    `payload.payload.encodedItem.data`；heartbeat 和 done 不推进 afterSeq。占位留存策略下，业务
    ChatEvent 可能仅实时传输，不进入 Event Resume。

    Redis 或本机 live buffer 无法保证继续实时交付时，服务端返回 `RECOVER_REQUIRED`。客户端
    应停止当前订阅，使用 `details.recoveryAfterSeq` 调用 run 级 Event Resume，再选择一条实时
    消费链继续处理。同一 run 不应同时消费 WebSocket 和 run 级 SSE。
  identityContext: 复用 WebSocket Upgrade 时企业框架建立的身份上下文和现有 Origin 校验。
  clientMessages:
    connect:
      $ref: '#/components/schemas/WebSocketConnectCommand'
    presence:
      $ref: '#/components/schemas/WebSocketPresenceCommand'
    subscribe:
      $ref: '#/components/schemas/WebSocketSubscribeCommand'
    unsubscribe:
      $ref: '#/components/schemas/WebSocketUnsubscribeCommand'
  serverMessages:
    reply:
      $ref: '#/components/schemas/ChatWebSocketEnvelope'
    message:
      $ref: '#/components/schemas/ChatWebSocketEnvelope'
    error:
      $ref: '#/components/schemas/ChatWebSocketEnvelope'
  errors:
    - WS_AUTH_FAILED
    - WS_ORIGIN_FORBIDDEN
    - WS_MESSAGE_TOO_LARGE
    - BAD_WS_MESSAGE
    - SUBSCRIBE_ERROR
    - NOT_SUBSCRIBED
    - RECOVER_REQUIRED

paths:
  /v1/chat/runs:
    post:
      tags: [Chat Runs & Streaming]
      operationId: createChatRun
      summary: 创建聊天 Run 或续接 Interaction
      description: |
        唯一的提问和 Interaction 续接入口。普通请求通常使用 `runMode=NEXT`；WAIT 场景使用
        `runMode=CONTINUE_INTERACTION` 和服务端返回的 `interactionId`。

        接口只等待首个已经持久化的 ChatEvent，然后返回 runId、firstSeq 和 streamTopicId。
        后台 Run 不依赖浏览器连接继续执行。首次消费时将 `firstSeq` 视为已处理，然后使用
        WebSocket `subscribe(afterSeq=firstSeq)`；页面恢复 active run 时优先调用 run 级 Resume。

        WAIT 场景摘要：
        - 普通 Intent 澄清：提交 `questionnaireAnswers` 或有效附件；每轮使用新的消息 turn。
        - AMBIGUOUS_ROUTE 指定候选：提交 `targetType=DOMAIN_AGENT + targetId=skillId`。
        - AMBIGUOUS_ROUTE 代选：提交 `interactionAction=AUTO_SELECT`。
        - AMBIGUOUS_ROUTE 其他：提交答案或附件，重新调用 Intent。
        - 拒答切换确认：提交 `approved=true/false`；到达 autoActionAt 后前端提交 `approved=true`。
        - Relay 问卷：严格使用 `questionnaireAnswers.label`，忽略使用 `ignore=true`。

        `Cookie` 只作为内存请求头快照透传给可信 Runtime，不得出现在 body 或 metadata。
      parameters:
        - $ref: '#/components/parameters/OptionalCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRunRequest'
            examples:
              nextText:
                summary: 普通 NEXT 文本提问
                value:
                  commandId: cmd_001
                  sessionId: session_001
                  runMode: NEXT
                  message: 帮我分析本季度利润变化
                  language: zh_CN
                  metadata:
                    bizContext:
                      contextVersion: 1
                      application:
                        appId: com.huawei.finance.front.one
                        name: 财经作业平台
                        description: 面向财经作业人员的业务系统
                      page:
                        pageId: country-cfo-summary
                        name: 事项进展总结
                        description: 用于生成事项总结结论
              mobileNextWithNewSession:
                summary: 移动端自动创建 mobile 会话并提问
                value:
                  commandId: cmd_mobile_001
                  sessionId: null
                  runMode: NEXT
                  message: 查询资产负债率
                  channel: mobile
                  metadata: {}
              nextAttachmentOnly:
                summary: 普通 NEXT 附件-only；历史 user content 保存为空
                value:
                  commandId: cmd_002
                  sessionId: session_001
                  runMode: NEXT
                  message: null
                  attachments:
                    - documentId: doc_001
                  metadata: {}
              directDomainAgent:
                summary: 显式直连 DomainAgent
                value:
                  commandId: cmd_003
                  sessionId: session_001
                  runMode: NEXT
                  message: 分析这份经营报告
                  targetType: DOMAIN_AGENT
                  targetId: finance_analysis_agent
                  selectedIntent:
                    intentId: finance.analysis
                    intentName: 财务分析
                  attachments:
                    - documentId: doc_001
                  agentMode:
                    selections:
                      - scheme: thinking
                        code: deep
                        displayName: 深度思考
                  metadata: {}
              editUser:
                summary: 编辑历史 user 消息
                value:
                  commandId: cmd_004
                  sessionId: session_001
                  runMode: EDIT_USER
                  editedMessageId: msg_user_001
                  message: 请改为分析同比利润变化
                  metadata: {}
              regenerateAssistant:
                summary: 重新生成历史 assistant 回答
                value:
                  commandId: cmd_005
                  sessionId: session_001
                  runMode: REGENERATE_ASSISTANT
                  regeneratedMessageId: msg_assistant_001
                  metadata: {}
              forceReroute:
                summary: 用户纠偏并强制重新意图
                description: 当前实现直接采用新的 Intent 结果；只有结果为 CLARIFY 时才进入 WAIT。
                value:
                  commandId: cmd_006
                  sessionId: session_001
                  runMode: NEXT
                  forceReroute: true
                  message: 重新判断，我要使用财经知识问答
                  metadata:
                    lastIntentRejectReason:
                      lastIntent: 智能文档
                      domainRejectMessage: 用户主动要求重新路由
              intentClarificationAnswer:
                summary: 普通 Intent 澄清回答
                value:
                  commandId: cmd_007
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_intent_001
                  questionnaireAnswers:
                    需要分析哪个指标: 利润变化
                  metadata: {}
              intentClarificationAttachmentOnly:
                summary: 普通 Intent 澄清附件-only
                value:
                  commandId: cmd_008
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_intent_001
                  attachments:
                    - documentId: doc_002
                  metadata: {}
              ambiguousSelectCandidate:
                summary: AMBIGUOUS_ROUTE 指定候选技能
                value:
                  commandId: cmd_009
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_ambiguous_001
                  targetType: DOMAIN_AGENT
                  targetId: finance_data_query
                  metadata: {}
              ambiguousAutoSelect:
                summary: 点击代为选择或前端到达 autoSelectAt 后代选
                value:
                  commandId: cmd_010
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_ambiguous_001
                  interactionAction: AUTO_SELECT
                  metadata: {}
              ambiguousOtherText:
                summary: AMBIGUOUS_ROUTE 选择“其他”并重新意图
                value:
                  commandId: cmd_011
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_ambiguous_001
                  questionnaireAnswers:
                    其他: 我需要查询基金净值
                  metadata: {}
              ambiguousOtherAttachment:
                summary: AMBIGUOUS_ROUTE 选择“其他”并只上传附件
                value:
                  commandId: cmd_012
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_ambiguous_001
                  attachments:
                    - documentId: doc_003
                  metadata: {}
              refusalSwitchApprove:
                summary: DomainAgent 拒答后确认切换到新目标
                value:
                  commandId: cmd_013
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_switch_001
                  approved: true
                  scope: once
                  metadata: {}
              refusalSwitchDecline:
                summary: DomainAgent 拒答后拒绝切换
                value:
                  commandId: cmd_014
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_switch_001
                  approved: false
                  scope: once
                  metadata: {}
              relayQuestionnaireAnswer:
                summary: Relay 问卷单选、多选和自定义文本回答
                value:
                  commandId: cmd_015
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_relay_001
                  approved: true
                  scope: once
                  questionnaireAnswers:
                    label:
                      请选择技术方案: 方案A
                      请选择部署环境:
                        - 开发环境
                        - 测试环境
                      请补充说明: 优先保证稳定性
                  metadata: {}
              relayQuestionnaireIgnore:
                summary: 用户点击忽略或前端到达 autoActionAt 后忽略 Relay 问卷
                value:
                  commandId: cmd_016
                  sessionId: session_001
                  runMode: CONTINUE_INTERACTION
                  interactionId: interaction_relay_001
                  approved: false
                  scope: once
                  questionnaireAnswers:
                    ignore: true
                  metadata: {}
      responses:
        '200':
          description: Run 已创建，首个事件已经持久化
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatRunStart'
                  - $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                created:
                  value:
                    runId: run_002
                    sessionId: session_001
                    firstSeq: 1042
                    createdAt: '2026-08-01T10:00:00Z'
                    streamTopicId: chat-run-run_002
                accessDenied:
                  $ref: '#/components/examples/AccessDenied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/chat/intent-candidates:
    post:
      tags: [Chat Runs & Streaming]
      operationId: queryIntentCandidates
      summary: 按user消息查询Intent候选技能
      description: |
        校验messageId属于当前用户且role=user后，转发Intent置信度接口并直接返回
        data.confidence.topCandidates。候选不缓存、不持久化，也不执行敏感信息或专家模式解析。
        accessName保持下游原值，skillId仅按financeex.intent.response-access-name-prefix
        区分大小写移除一次并trim。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentCandidateQueryRequest'
            example:
              messageId: msg_d0a6c41dd1ed43efbc9ece562b66d44
      responses:
        '200':
          description: 候选数组，或沿用现有资源越权提示体
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/IntentCandidateQueryItem'
                  - $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                candidates:
                  value:
                    - intentId: 607294d4b2da408894fba3e92aad3c25
                      accessName: EX_finance_query
                      skillId: finance_query
                      intentName: 财经智能问数
                      confidence: 0.92
                empty:
                  value: []
                accessDenied:
                  $ref: '#/components/examples/AccessDenied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 当前实例的Intent候选查询或候选鉴权容量已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                timestamp: '2026-08-27T10:00:00Z'
                path: /v1/chat/intent-candidates
                status: 429
                error: Too Many Requests
                code: INTENT_CANDIDATES_BUSY
                message: Intent候选技能查询繁忙，请稍后重试
        '502':
          description: Intent候选技能服务调用或协议解析失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                timestamp: '2026-08-27T10:00:00Z'
                path: /v1/chat/intent-candidates
                status: 502
                error: Bad Gateway
                code: INTENT_CANDIDATES_UPSTREAM_FAILED
                message: Intent候选技能服务调用失败
        '504':
          description: Intent候选技能查询重试耗尽且最终失败为超时
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                timestamp: '2026-08-27T10:00:00Z'
                path: /v1/chat/intent-candidates
                status: 504
                error: Gateway Timeout
                code: INTENT_CANDIDATES_TIMEOUT
                message: Intent候选技能查询超时

  /v1/chat/intent-preference-corrections:
    post:
      tags: [Chat Runs & Streaming]
      operationId: recordIntentPreferenceCorrection
      summary: 独立记录用户选择的Intent偏好
      description: |
        前端应先提交Run，收到成功受理响应后再异步调用本接口。偏好保存失败不撤销已启动的Run，
        后续实际调用Intent时按当前用户和有效intentAccessName读取最近记录。

        INTENT_CANDIDATE使用当前用户拥有的source user消息及前端选择的意图摘要；
        AMBIGUOUS_ROUTE只接受已成功受理或已完成的人工SELECT_CANDIDATE Interaction，候选信息由服务端恢复。
        同一来源重复提交会覆盖为最后一次选择。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentPreferenceCorrectionRequest'
            examples:
              intentCandidate:
                value:
                  selectionType: INTENT_CANDIDATE
                  sourceMessageId: msg_original
                  selectedIntent:
                    intentId: intent_xxx
                    intentName: 支付成功率分析
                  intentAccessName: finance_pc_entry
              ambiguousRoute:
                value:
                  selectionType: AMBIGUOUS_ROUTE
                  interactionId: interaction_xxx
                  intentAccessName: finance_pc_entry
      responses:
        '204':
          description: 偏好已记录，无响应体
        '200':
          description: 资源不存在或不属于当前用户时沿用ACCESS_DENIED提示体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                accessDenied:
                  $ref: '#/components/examples/AccessDenied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 偏好记录数据库或独立写入执行器暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                timestamp: '2026-08-27T10:00:00Z'
                path: /v1/chat/intent-preference-corrections
                status: 503
                error: Service Unavailable
                code: INTENT_PREFERENCE_UNAVAILABLE
                message: 意图偏好记录暂不可用，请稍后重试

  /v1/internal/domain-agent/async-tasks/callback:
    post:
      tags: [Internal DomainAgent]
      operationId: completeDomainAgentAsyncTask
      summary: 回调DomainAgent后台任务结果
      description: |
        仅允许企业网关ACL内的DomainAgent调用，不依赖用户Cookie。`runId`是ChatService调用
        DomainAgent时提供的可信任务标识。只有仍处于`ASYNC_RUNNING`的Run可以接受一次回调；
        重复、迟到以及已经stop或超时的回调返回`accepted=false`。

        `frames`复用DomainAgent流式响应帧格式。非空时必须指定`APPEND`或`REPLACE`；为空时只提交
        任务终态。成功接受后依次推送`run.async_result_started`、标准结果事件、
        `message.completed`和`run.completed/run.failed`。
      x-enterprise-gateway-acl: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainAgentAsyncTaskCallbackRequest'
            examples:
              completedWithResult:
                value:
                  runId: run_xxx
                  status: COMPLETED
                  resultMode: APPEND
                  frames:
                    - content: 异步任务结果
                    - searchList: []
                  error: null
              completedWithoutResult:
                value:
                  runId: run_xxx
                  status: COMPLETED
                  frames: []
      responses:
        '200':
          description: 回调已接受或已幂等忽略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainAgentAsyncTaskCallbackResponse'
              examples:
                accepted:
                  value:
                    accepted: true
                duplicate:
                  value:
                    accepted: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 异步任务协议未启用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: 本实例异步回调并发容量已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /v1/chat/runs/{runId}/stop:
    post:
      tags: [Chat Runs & Streaming]
      operationId: stopChatRun
      summary: 统一停止运行态 Run 或取消等待态 Interaction
      description: |
        运行态使用 `activeRunId`；等待态使用 `stream-status.waitingSourceRunId`。请求无 body。

        - RUNNING/CANCELLING：调用当前 Runtime 的真实取消能力并按既有流程保存 partial assistant。
        - Intent 澄清或 AMBIGUOUS_ROUTE：取消本地 Interaction；没有实际 Runtime 时不调用下游。
        - Relay 问卷：取消精确 ACTIVE Binding，并尽力执行 `RESUME + stop_all_agents`。
        - DomainAgent 等待：调用实际 DomainAgent cancel。

        等待源 run-A 的历史状态仍保持 WAITING_USER，但 Interaction 变为 CANCELLED，随后允许新的 NEXT。
        若 run-B 已经创建，`effectiveRunId` 返回实际被停止的 continuation run。
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/OptionalCookie'
      responses:
        '200':
          description: Stop 已幂等处理；也可能是 ACCESS_DENIED 提示
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatRunStop'
                  - $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                runningStopped:
                  value:
                    runId: run_002
                    sessionId: session_001
                    status: CANCELLED
                    latestSeq: 1102
                    stoppedAt: '2026-08-01T10:00:20Z'
                    messageReady: true
                    assistantMessageId: msg_assistant_001
                    feedbackTargetMessageId: msg_assistant_001
                    waitingUserInput: false
                waitingCancelled:
                  value:
                    runId: run_A
                    sessionId: session_001
                    status: WAITING_USER
                    latestSeq: 1205
                    stoppedAt: '2026-08-01T10:01:00Z'
                    messageReady: true
                    assistantMessageId: msg_assistant_wait_001
                    feedbackTargetMessageId: msg_assistant_wait_001
                    waitingUserInput: false
                    interactionId: interaction_ambiguous_001
                    interactionStatus: CANCELLED
                    interactionCancelledAt: '2026-08-01T10:01:00Z'
                    effectiveRunId: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/chat/sessions/{sessionId}/events/resume:
    get:
      tags: [Chat Runs & Streaming]
      operationId: resumeSessionEvents
      summary: 补发会话已落库事件
      description: |
        只读取当前会话中 `sequence > afterSeq` 的有限数据库事件，不提供 active run 的持续 live tail。
        适合补齐会话级缺口，不用于恢复某个 active run 的实时输出。SSE event name 固定为
        `conversation-turn-stream`。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AfterSeq'
      responses:
        '200':
          $ref: '#/components/responses/ConversationTurnStreamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/chat/runs/{runId}/events/resume:
    get:
      tags: [Chat Runs & Streaming]
      operationId: resumeRunEvents
      summary: 补发指定 Run 并接续实时尾流
      description: |
        实现先订阅 live buffer，再查询数据库，以覆盖查询与实时订阅之间的窗口；随后按 sequence 去重并
        输出 `sequence > afterSeq` 的事件。active run 会继续输出 live tail，直到持久化终态后发送 done。

        DomainAgent返回`agent.async_started`后，服务端持久化`run.async_running`并结束本次Run Resume，
        但业务Run仍保持RUNNING且不会发送done。回调完成后再次Resume可补发异步结果和真正终态；已建立的
        WebSocket Run topic订阅也可直接收到回调事件。

        `ASSISTANT_PLACEHOLDER` 留存策略下，数据库补发只包含控制、Intent和终态事件；连接建立后的
        live-only业务事件仍实时输出，但连接建立前或断线期间遗漏的业务内容不可恢复。

        页面重新打开时，若 `stream-status.activeRunId` 存在，建议以
        `activeRunFirstSeq - 1` 为 afterSeq 恢复完整当前 run。收到 `RECOVER_REQUIRED` 后，以服务端建议
        水位重新调用本接口。同一 run 恢复期间只使用本 SSE 或 WebSocket 其中之一。
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/AfterSeq'
      responses:
        '200':
          $ref: '#/components/responses/ConversationTurnStreamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/chat/sessions/{sessionId}/stream-status:
    get:
      tags: [Chat Runs & Streaming]
      operationId: getChatStreamStatus
      summary: 查询会话当前 Run、WAIT 和 Binding 状态
      description: |
        页面刷新、跨页签或跨浏览器恢复的入口。先查询历史消息以恢复已保存的等待卡片，再读取本接口：
        - 有 activeRunId：使用 run 级 Resume。
        - waitingUserInput=true：使用 waitingSourceRunId 执行 stop，或使用 interactionId 续接。
        - AMBIGUOUS_ROUTE 的 autoSelectAt 已到：前端提交 AUTO_SELECT。
        - 路由切换确认的 autoActionAt 已到：前端提交 approved=true。
        - Relay 的 autoActionAt 已到：前端提交 ignore=true。

        run-A 与续接 run-B 使用不同 runId，但 AMBIGUOUS_ROUTE 和 Relay 问卷会复用同一个 assistant。
        run-B 处于 active 状态时，本接口继续返回 interactionId、interactionType 和 assistantMessageId；
        前端使用 assistantMessageId 定位历史消息，并将 run-B 的 Resume 事件追加到同一个 assistant。

        `activeRunPhase=ASYNC_RUNNING`表示DomainAgent已关闭原流并转入后台任务；此时仍可stop，且同会话
        不能发起新Run。`asyncExpiresAt`是后台任务等待截止时间。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 会话流式状态；也可能是 ACCESS_DENIED 提示
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatStreamStatus'
                  - $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                activeReusableContinuation:
                  value:
                    sessionId: session_001
                    latestSeq: 1300
                    activeRunId: run_B
                    activeRunStatus: RUNNING
                    activeStreamTopicId: chat-run-run_B
                    activeRunFirstSeq: 1280
                    activeRunLastSeq: 1300
                    cancellable: true
                    waitingUserInput: false
                    interactionId: interaction_001
                    interactionType: AGENT_CLARIFICATION
                    assistantMessageId: msg_assistant_001
                domainAgentAsyncRunning:
                  value:
                    sessionId: session_001
                    latestSeq: 1350
                    activeRunId: run_async_001
                    activeRunStatus: RUNNING
                    activeRunPhase: ASYNC_RUNNING
                    asyncExpiresAt: '2026-08-29T10:00:00Z'
                    activeStreamTopicId: chat-run-run_async_001
                    activeRunFirstSeq: 1310
                    activeRunLastSeq: 1350
                    cancellable: true
                    waitingUserInput: false
                    assistantMessageId: msg_assistant_async_001
                ambiguousWaiting:
                  value:
                    sessionId: session_001
                    latestSeq: 1205
                    activeRunId: null
                    activeRunStatus: null
                    activeStreamTopicId: null
                    activeRunFirstSeq: null
                    activeRunLastSeq: null
                    cancellable: false
                    waitingUserInput: true
                    waitingSourceRunId: run_A
                    interactionId: interaction_ambiguous_001
                    interactionType: INTENT_CLARIFICATION
                    assistantMessageId: msg_assistant_wait_001
                    expiresAt: '2026-08-02T10:00:00Z'
                    autoSelectAt: '2026-08-01T10:00:30Z'
                    autoSelectTimeoutMs: 30000
                relayWaiting:
                  value:
                    sessionId: session_001
                    latestSeq: 1405
                    activeRunId: null
                    activeRunStatus: null
                    activeStreamTopicId: null
                    cancellable: false
                    waitingUserInput: true
                    waitingSourceRunId: run_relay_A
                    interactionId: interaction_relay_001
                    interactionType: AGENT_CLARIFICATION
                    assistantMessageId: msg_assistant_relay_001
                    expiresAt: '2026-08-02T10:00:00Z'
                    autoActionAt: '2026-08-01T10:01:00Z'
                    autoActionTimeoutMs: 60000
                    autoActionType: IGNORE_QUESTIONNAIRE
        '401':
          $ref: '#/components/responses/Unauthorized'

