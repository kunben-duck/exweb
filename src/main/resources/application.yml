server:
  port: 8080

spring:
  application:
    name: FinanceEXChatService
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${FINANCEEX_DB_URL:jdbc:postgresql://localhost:5432/financeex}
    username: ${FINANCEEX_DB_USERNAME:financeex}
    password: ${FINANCEEX_DB_PASSWORD:financeex}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${FINANCEEX_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${FINANCEEX_DB_MIN_IDLE:0}
      connection-timeout: ${FINANCEEX_DB_CONNECTION_TIMEOUT:3000}
      initialization-fail-timeout: ${FINANCEEX_DB_INITIALIZATION_FAIL_TIMEOUT:-1}
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms

management:
  health:
    db:
      enabled: ${FINANCEEX_DB_HEALTH_ENABLED:true}
    redis:
      enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

financeex:
  intent:
    provider: mock
  memory:
    short-term:
      redis:
        enabled: true
        key-prefix: financeex:memory:short-term
        ttl: 3d
        max-cached-messages: 200
        failure-backoff: 30s
    long-term:
      provider: mock-external
  agent:
    engine: AGENTSCOPE
    agentscope:
      base-url: http://localhost:8000/v1
      api-key: dummy-key
      model-name: finance-llm
      max-iters: 8
  runtime:
    enabled: false
    base-url: http://localhost:9000
    stream-path: /v1/agent/runs/stream
  storage:
    local-path: ${java.io.tmpdir}/financeex-docs
