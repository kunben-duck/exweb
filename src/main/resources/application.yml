server:
  port: 8080
  tomcat:
    max-connections: ${FINANCEEX_TOMCAT_MAX_CONNECTIONS:8192}
    threads:
      max: ${FINANCEEX_TOMCAT_THREADS_MAX:200}
      min-spare: ${FINANCEEX_TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${FINANCEEX_TOMCAT_ACCEPT_COUNT:200}
    connection-timeout: ${FINANCEEX_TOMCAT_CONNECTION_TIMEOUT:20s}

spring:
  application:
    name: FinanceEXChatService
  mvc:
    async:
      request-timeout: ${FINANCEEX_MVC_ASYNC_REQUEST_TIMEOUT:30m}
  servlet:
    multipart:
      max-file-size: ${FINANCEEX_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${FINANCEEX_MULTIPART_MAX_REQUEST_SIZE:60MB}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${FINANCEEX_DB_URL:}
    username: ${FINANCEEX_DB_USERNAME:}
    password: ${FINANCEEX_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: ${FINANCEEX_DB_SCHEMA:supervisor_dev}
      maximum-pool-size: ${FINANCEEX_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${FINANCEEX_DB_MIN_IDLE:0}
      connection-timeout: ${FINANCEEX_DB_CONNECTION_TIMEOUT:500}
      initialization-fail-timeout: ${FINANCEEX_DB_INITIALIZATION_FAIL_TIMEOUT:1}
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
management:
  health:
    db:
      enabled: ${FINANCEEX_DB_HEALTH_ENABLED:false}
    redis:
      enabled: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.opengauss.xml
  configuration:
    map-underscore-to-camel-case: true

financeex:
  redis:
    # Redis 只作为热缓存、取消标记、恢复锁优化和跨实例实时 fanout，不作为事实源。
    # 生产 Redis Cluster 设置 FINANCEEX_REDIS_MODE=cluster 并配置 cluster.nodes；本地 standalone 也必须显式配置 host。
    mode: ${FINANCEEX_REDIS_MODE:}
    host: ${FINANCEEX_REDIS_HOST:}
    port: ${FINANCEEX_REDIS_PORT:6379}
    database: ${FINANCEEX_REDIS_DATABASE:0}
    password: ${FINANCEEX_REDIS_PASSWORD:}
    timeout: ${FINANCEEX_REDIS_TIMEOUT:500ms}
    connect-timeout: ${FINANCEEX_REDIS_CONNECT_TIMEOUT:500ms}
    cluster:
      # 逗号分隔，例如：10.0.0.1:6379,10.0.0.2:6379,10.0.0.3:6379
      nodes: ${FINANCEEX_REDIS_CLUSTER_NODES:}
      max-redirects: ${FINANCEEX_REDIS_CLUSTER_MAX_REDIRECTS:3}
      topology-refresh-period: ${FINANCEEX_REDIS_CLUSTER_TOPOLOGY_REFRESH_PERIOD:30s}
      adaptive-refresh-enabled: ${FINANCEEX_REDIS_CLUSTER_ADAPTIVE_REFRESH_ENABLED:true}
  integration-auth:
    # 集成服务鉴权请求头统一防腐层；默认关闭，不影响现有外部服务调用。
    enabled: ${FINANCEEX_INTEGRATION_AUTH_ENABLED:false}
    default-provider: ${FINANCEEX_INTEGRATION_AUTH_DEFAULT_PROVIDER:none}
    sgov:
      app-id: ${FINANCEEX_SGOV_APP_ID:}
      secret: ${FINANCEEX_SGOV_SECRET:}
    services:
      welink-share:
        provider: ${FINANCEEX_WELINK_SHARE_AUTH_PROVIDER:sgov}
      intent-service:
        provider: ${FINANCEEX_INTENT_SERVICE_AUTH_PROVIDER:sgov}
      use-case-library:
        provider: ${FINANCEEX_USE_CASE_LIBRARY_AUTH_PROVIDER:sgov}
  # 可选覆盖当前进程运行实例 ID；为空时由 GeneratedApplicationInstanceIdProvider 生成。
  # 后续如需从注册中心获取实例 ID，直接提供新的 ApplicationInstanceIdProvider bean。
  instance-id: ${FINANCEEX_INSTANCE_ID:}
  scheduler:
    # 运行治理定时任务线程池；至少 2 个线程，避免 watchdog 抖动影响 heartbeat。
    pool-size: ${FINANCEEX_SCHEDULER_POOL_SIZE:4}
  intent:
    # v3 中意图服务只是可选路由信号，默认关闭；关闭时首轮请求不会调用该 HTTP API。
    enabled: ${FINANCEEX_INTENT_ENABLED:false}
    base-url: ${FINANCEEX_INTENT_BASE_URL:}
    access-name: ${FINANCEEX_INTENT_ACCESS_NAME:}
    recognize-path: ${FINANCEEX_INTENT_RECOGNIZE_PATH:/intent-recognition-configuration/getIntentDecision}
    trace: ${FINANCEEX_INTENT_TRACE:false}
    # confidence 仅用于记录和排障；是否进入 DomainAgent 以 routeAction=ROUTE_SINGLE 为准。
    confidence-threshold: ${FINANCEEX_INTENT_CONFIDENCE_THRESHOLD:0.85}
    timeout: ${FINANCEEX_INTENT_TIMEOUT:5s}
    # 意图服务调用失败后的最大重试次数；不包含首次调用，运行时最多按 10 次生效。
    max-retries: ${FINANCEEX_INTENT_MAX_RETRIES:3}
  intent-record:
    # 意图识别记录是统计排障旁路，默认关闭；关闭时不会写 fin_ex_intent_recognition_t。
    enabled: ${FINANCEEX_INTENT_RECORD_ENABLED:false}
    max-query-length: ${FINANCEEX_INTENT_RECORD_MAX_QUERY_LENGTH:4096}
    max-raw-json-length: ${FINANCEEX_INTENT_RECORD_MAX_RAW_JSON_LENGTH:65536}
    executor:
      core-size: ${FINANCEEX_INTENT_RECORD_EXECUTOR_CORE_SIZE:1}
      max-size: ${FINANCEEX_INTENT_RECORD_EXECUTOR_MAX_SIZE:2}
      queue-capacity: ${FINANCEEX_INTENT_RECORD_EXECUTOR_QUEUE_CAPACITY:1000}
  route-memory:
    # RouteMemory 是意图路由上下文事实源，不受普通短期/长期 memory 开关影响。
    top-k: ${FINANCEEX_ROUTE_MEMORY_TOP_K:5}
    max-clarification-rounds: ${FINANCEEX_ROUTE_MEMORY_MAX_CLARIFICATION_ROUNDS:3}
    # RouteMemory 只增强意图上下文；读取超时或写入失败均降级，不阻断 /chat/runs 主链路。
    timeout: ${FINANCEEX_ROUTE_MEMORY_TIMEOUT:300ms}
    read-timeout: ${FINANCEEX_ROUTE_MEMORY_READ_TIMEOUT:${FINANCEEX_ROUTE_MEMORY_TIMEOUT:300ms}}
    executor:
      core-size: ${FINANCEEX_ROUTE_MEMORY_EXECUTOR_CORE_SIZE:1}
      max-size: ${FINANCEEX_ROUTE_MEMORY_EXECUTOR_MAX_SIZE:2}
      queue-capacity: ${FINANCEEX_ROUTE_MEMORY_EXECUTOR_QUEUE_CAPACITY:1000}
    read-executor:
      core-size: ${FINANCEEX_ROUTE_MEMORY_READ_EXECUTOR_CORE_SIZE:1}
      max-size: ${FINANCEEX_ROUTE_MEMORY_READ_EXECUTOR_MAX_SIZE:2}
      queue-capacity: ${FINANCEEX_ROUTE_MEMORY_READ_EXECUTOR_QUEUE_CAPACITY:64}
    write-executor:
      core-size: ${FINANCEEX_ROUTE_MEMORY_WRITE_EXECUTOR_CORE_SIZE:1}
      max-size: ${FINANCEEX_ROUTE_MEMORY_WRITE_EXECUTOR_MAX_SIZE:1}
      queue-capacity: ${FINANCEEX_ROUTE_MEMORY_WRITE_EXECUTOR_QUEUE_CAPACITY:1000}
    circuit-breaker:
      failure-threshold: ${FINANCEEX_ROUTE_MEMORY_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      open-duration: ${FINANCEEX_ROUTE_MEMORY_CIRCUIT_BREAKER_OPEN_DURATION:30s}
  use-case-library:
    # v3 中用例库只是可选路由信号，默认关闭；关闭时首轮请求不会调用该 HTTP API。
    enabled: ${FINANCEEX_USE_CASE_LIBRARY_ENABLED:false}
    min-score: 0.85
    base-url: ${FINANCEEX_USE_CASE_LIBRARY_BASE_URL:}
    match-path: ${FINANCEEX_USE_CASE_LIBRARY_MATCH_PATH:/v1/use-cases/match}
    timeout: 5s
  runtime-binding:
    ttl: 3d
    # 逻辑前缀；实际 Redis key 会自动注入 spring.profiles.active 的第一个 profile：
    # fin_ex:runtime_binding -> fin_ex:{env}:runtime_binding。
    redis-key-prefix: fin_ex:runtime_binding
    redis-ttl: 3d
  chat-run:
    # 以下均为逻辑前缀；实际 key 会由 FinanceExRedisKeyBuilder 变为 fin_ex:{env}:...
    active-key-prefix: fin_ex:chat_run:active
    cancel-key-prefix: fin_ex:chat_run:cancel
    recover-lock-key-prefix: fin_ex:chat_run:recover_lock
    active-ttl: 6h
    cancel-ttl: 1h
    lease-duration: ${FINANCEEX_CHAT_RUN_LEASE_DURATION:90s}
    heartbeat-interval: ${FINANCEEX_CHAT_RUN_HEARTBEAT_INTERVAL:15s}
    watchdog-enabled: ${FINANCEEX_CHAT_RUN_WATCHDOG_ENABLED:true}
    watchdog-initial-delay: ${FINANCEEX_CHAT_RUN_WATCHDOG_INITIAL_DELAY:30s}
    watchdog-scan-interval: ${FINANCEEX_CHAT_RUN_WATCHDOG_SCAN_INTERVAL:30s}
    watchdog-batch-size: ${FINANCEEX_CHAT_RUN_WATCHDOG_BATCH_SIZE:100}
    watchdog-max-claims-per-scan: ${FINANCEEX_CHAT_RUN_WATCHDOG_MAX_CLAIMS_PER_SCAN:20}
    recovery-max-concurrency: ${FINANCEEX_CHAT_RUN_RECOVERY_MAX_CONCURRENCY:4}
    takeover-max-concurrency: ${FINANCEEX_CHAT_RUN_TAKEOVER_MAX_CONCURRENCY:1}
    recovery-max-claims-per-tenant-per-scan: ${FINANCEEX_CHAT_RUN_RECOVERY_MAX_CLAIMS_PER_TENANT_PER_SCAN:5}
    watchdog-jitter: ${FINANCEEX_CHAT_RUN_WATCHDOG_JITTER:5s}
    stale-recovery-strategies: ${FINANCEEX_CHAT_RUN_STALE_RECOVERY_STRATEGIES:MANUAL_CONFIRMATION,FAIL_FAST}
    recover-lock-enabled: ${FINANCEEX_CHAT_RUN_RECOVER_LOCK_ENABLED:true}
    recover-lock-ttl: ${FINANCEEX_CHAT_RUN_RECOVER_LOCK_TTL:30s}
  chat-interaction:
    # Relay questionnaire 等协议级等待用户输入的默认有效期；配置为 0 或负数表示不过期。
    default-expire-duration: ${FINANCEEX_CHAT_INTERACTION_DEFAULT_EXPIRE_DURATION:24h}
  chat-stream:
    # 当前生产止血版本不合并 message.delta，避免 ChatService 内部背压把任务误标记为 run.failed。
    # 以下 delta-coalesce-* 配置仅作为后续 demand-aware 合并器的兼容预留，当前不影响事件粒度。
    delta-coalesce-enabled: ${FINANCEEX_CHAT_STREAM_DELTA_COALESCE_ENABLED:false}
    delta-coalesce-window: ${FINANCEEX_CHAT_STREAM_DELTA_COALESCE_WINDOW:50ms}
    delta-coalesce-max-chars: ${FINANCEEX_CHAT_STREAM_DELTA_COALESCE_MAX_CHARS:512}
    # WebSocket 与 run 级 Event Resume 的 turn stream heartbeat；不写入事件表，也不推进 afterSeq。
    turn-heartbeat-interval: ${FINANCEEX_CHAT_STREAM_TURN_HEARTBEAT_INTERVAL:15s}
    # 实时事件来源。生产默认只消费 Redis，避免 local sink 与 Redis Pub/Sub merge 后同 topic seq 乱序。
    # 可选：redis-only、merge、local-only；merge 仅建议兼容排障时使用。
    live-source-mode: ${FINANCEEX_CHAT_STREAM_LIVE_SOURCE_MODE:redis-only}
    # live topic 短窗口排序：不合并事件，只对已到达事件按 seq 升序逐条输出，减少低 seq 迟到导致的 RECOVER_REQUIRED。
    live-reorder-enabled: ${FINANCEEX_CHAT_STREAM_LIVE_REORDER_ENABLED:true}
    live-reorder-window: ${FINANCEEX_CHAT_STREAM_LIVE_REORDER_WINDOW:20ms}
    live-reorder-max-events: ${FINANCEEX_CHAT_STREAM_LIVE_REORDER_MAX_EVENTS:128}
    # 下游流式事件合并后，落库、run 状态推进和实时发布会切换到该专用 IO 调度器，避免占用 Reactor parallel/Servlet 线程。
    event-io-executor-max-size: ${FINANCEEX_CHAT_STREAM_EVENT_IO_EXECUTOR_MAX_SIZE:16}
    event-io-executor-queue-capacity: ${FINANCEEX_CHAT_STREAM_EVENT_IO_EXECUTOR_QUEUE_CAPACITY:10000}
  websocket:
    # WebSocket 是用户级连接，事件按 run 级 stream topic 订阅；Redis Pub/Sub 只做跨实例实时扇出。
    # 前端 WS 入口同时支持 WebFlux 与 Servlet/MVC；Servlet 模式的上下文根使用 server.servlet.context-path。
    # 逻辑 channel 前缀；实际 channel 为 fin_ex:{env}:chat_stream:...
    redis-channel-prefix: fin_ex:chat_stream
    # Redis Pub/Sub 跨实例实时发布使用独立有界执行器，避免 Redis 抖动阻塞 run 主链路。
    redis-publish-executor-core-size: ${FINANCEEX_WEBSOCKET_REDIS_PUBLISH_EXECUTOR_CORE_SIZE:2}
    redis-publish-executor-max-size: ${FINANCEEX_WEBSOCKET_REDIS_PUBLISH_EXECUTOR_MAX_SIZE:8}
    redis-publish-queue-capacity: ${FINANCEEX_WEBSOCKET_REDIS_PUBLISH_QUEUE_CAPACITY:4096}
    redis-publish-topic-queue-size: ${FINANCEEX_WEBSOCKET_REDIS_PUBLISH_TOPIC_QUEUE_SIZE:1024}
    redis-publish-topic-max-bytes: ${FINANCEEX_WEBSOCKET_REDIS_PUBLISH_TOPIC_MAX_BYTES:8MB}
    redis-publish-retry-attempts: ${FINANCEEX_WEBSOCKET_REDIS_PUBLISH_RETRY_ATTEMPTS:2}
    redis-publish-retry-backoff: ${FINANCEEX_WEBSOCKET_REDIS_PUBLISH_RETRY_BACKOFF:20ms}
    redis-publish-recovery-retry-interval: ${FINANCEEX_WEBSOCKET_REDIS_PUBLISH_RECOVERY_RETRY_INTERVAL:1s}
    # 必须显式配置企业前端域名白名单，例如 https://finex.example.com；本地联调也请在 local profile 中配置。
    allowed-origin-patterns: ${FINANCEEX_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:}
    max-connections-per-user: ${FINANCEEX_WEBSOCKET_MAX_CONNECTIONS_PER_USER:8}
    max-subscriptions-per-connection: ${FINANCEEX_WEBSOCKET_MAX_SUBSCRIPTIONS_PER_CONNECTION:8}
    max-subscribers-per-topic: ${FINANCEEX_WEBSOCKET_MAX_SUBSCRIBERS_PER_TOPIC:128}
    max-inbound-message-bytes: ${FINANCEEX_WEBSOCKET_MAX_INBOUND_MESSAGE_BYTES:16384}
    outbound-queue-size: ${FINANCEEX_WEBSOCKET_OUTBOUND_QUEUE_SIZE:256}
    live-buffer-capacity: ${FINANCEEX_WEBSOCKET_LIVE_BUFFER_CAPACITY:512}
    delivered-seq-window: ${FINANCEEX_WEBSOCKET_DELIVERED_SEQ_WINDOW:2048}
    send-time-limit: ${FINANCEEX_WEBSOCKET_SEND_TIME_LIMIT:10s}
    send-buffer-size-bytes: ${FINANCEEX_WEBSOCKET_SEND_BUFFER_SIZE_BYTES:524288}
    servlet-send-executor-core-size: ${FINANCEEX_WEBSOCKET_SERVLET_SEND_EXECUTOR_CORE_SIZE:4}
    servlet-send-executor-max-size: ${FINANCEEX_WEBSOCKET_SERVLET_SEND_EXECUTOR_MAX_SIZE:16}
    servlet-send-queue-capacity: ${FINANCEEX_WEBSOCKET_SERVLET_SEND_QUEUE_CAPACITY:${FINANCEEX_WEBSOCKET_OUTBOUND_QUEUE_SIZE:256}}
    servlet-send-queue-max-bytes: ${FINANCEEX_WEBSOCKET_SERVLET_SEND_QUEUE_MAX_BYTES:2MB}
    servlet-send-use-virtual-threads: ${FINANCEEX_WEBSOCKET_SERVLET_SEND_USE_VIRTUAL_THREADS:false}
    idle-timeout: ${FINANCEEX_WEBSOCKET_IDLE_TIMEOUT:10m}
    idle-check-interval: ${FINANCEEX_WEBSOCKET_IDLE_CHECK_INTERVAL:60s}
  run-admission:
    enabled: ${FINANCEEX_RUN_ADMISSION_ENABLED:true}
    max-runs-per-user-per-minute: ${FINANCEEX_RUN_MAX_PER_USER_PER_MINUTE:60}
    max-concurrent-runs-per-tenant: ${FINANCEEX_RUN_MAX_CONCURRENT_PER_TENANT:200}
  resource-isolation:
    agent-runtime-max-concurrent: ${FINANCEEX_AGENT_RUNTIME_MAX_CONCURRENT:64}
    domain-agent-max-concurrent: ${FINANCEEX_DOMAIN_AGENT_MAX_CONCURRENT:64}
    document-storage-max-concurrent: ${FINANCEEX_DOCUMENT_STORAGE_MAX_CONCURRENT:32}
  memory:
    short-term:
      enabled: ${FINANCEEX_MEMORY_SHORT_TERM_ENABLED:false}
      recent-turns: ${FINANCEEX_MEMORY_SHORT_TERM_RECENT_TURNS:5}
      cache-enabled: ${FINANCEEX_MEMORY_SHORT_TERM_CACHE_ENABLED:true}
      # 逻辑前缀；实际 key 为 fin_ex:{env}:memory:short_term:...
      redis-key-prefix: fin_ex:memory:short_term
      ttl: 3d
      max-cached-messages: 200
      failure-backoff: 30s
      storage:
        database-required: ${FINANCEEX_SHORT_TERM_DB_REQUIRED:true}
        database-failure-backoff: 30s
    long-term:
      enabled: ${FINANCEEX_MEMORY_LONG_TERM_ENABLED:false}
      provider: ${FINANCEEX_MEMORY_LONG_TERM_PROVIDER:disabled}
      top-k: ${FINANCEEX_MEMORY_LONG_TERM_TOP_K:5}
  agent-runtime:
    # 没有显式 RuntimeBinding 时使用的 fallback provider；Relay 与 DomainAgent 可同时注册。
    default-provider: ${FINANCEEX_AGENT_RUNTIME_DEFAULT_PROVIDER:relay}
    base-url: ${FINANCEEX_RELAY_AGENT_BASE_URL:}
    stream-path: ${FINANCEEX_RELAY_AGENT_STREAM_PATH:/v1/agent/runs/stream}
    stop-path: ${FINANCEEX_RELAY_AGENT_STOP_PATH:/v1/agent/runs/{runId}/stop}
    cancel-supported: ${FINANCEEX_RELAY_AGENT_CANCEL_SUPPORTED:true}
    timeout: 60s
    # Relay 单个响应 frame 的 WebClient codec 上限；用于避免默认 256KB 过早拦截大引用/卡片响应。
    # 这不是前端事件大小治理，持续超大对象仍应通过后续 DataBuffer 流式解码与 fragment 分片解决。
    max-in-memory-size: ${FINANCEEX_RELAY_MAX_IN_MEMORY_SIZE:1MB}
    relay:
      enabled: ${FINANCEEX_RELAY_RUNTIME_ENABLED:true}
      # Relay provider 内部 API adapter。默认保持 stream-http；relay-websocket 用于灰度接入 Relay WS 普通问答。
      adapter: ${FINANCEEX_RELAY_ADAPTER:relay-stream-http}
      websocket:
        url: ${FINANCEEX_RELAY_WS_URL:}
        app-mode: ${FINANCEEX_RELAY_WS_APP_MODE:delegate}
        connect-timeout: ${FINANCEEX_RELAY_WS_CONNECT_TIMEOUT:5s}
        config-handshake-timeout: ${FINANCEEX_RELAY_WS_CONFIG_HANDSHAKE_TIMEOUT:10s}
        interrupt-ack-timeout: ${FINANCEEX_RELAY_WS_INTERRUPT_ACK_TIMEOUT:5s}
        max-run-duration: ${FINANCEEX_RELAY_WS_MAX_RUN_DURATION:30m}
        heartbeat-interval: ${FINANCEEX_RELAY_WS_HEARTBEAT_INTERVAL:20s}
        heartbeat-response-timeout: ${FINANCEEX_RELAY_WS_HEARTBEAT_RESPONSE_TIMEOUT:90s}
        # 仅用于 stop 临时控制连接等等待下一帧的场景；普通问答阶段使用 heartbeat-response-timeout + max-run-duration。
        idle-timeout: ${FINANCEEX_RELAY_WS_IDLE_TIMEOUT:60s}
        max-frame-bytes: ${FINANCEEX_RELAY_WS_MAX_FRAME_BYTES:1MB}
      # Relay 响应映射只属于 adapter 防腐层；ChatService 对前端仍输出稳定 ChatEvent。
      answer-event-types: ${FINANCEEX_RELAY_ANSWER_EVENT_TYPES:agent,message.delta,answer,output}
      answer-content-fields: ${FINANCEEX_RELAY_ANSWER_CONTENT_FIELDS:content,context,delta,message,text,output_text}
      agent-context-as-answer: ${FINANCEEX_RELAY_AGENT_CONTEXT_AS_ANSWER:true}
    forward-cookie:
      # 仅把 /chat/runs 与 /chat/runs/{runId}/stop 入口捕获到的 Cookie 透传给可信下游：
      # Relay stream-http adapter 和 DomainAgent adapter。
      # 文档上传 Cookie 透传由 financeex.document 与 financeex.storage.api-store 单独控制。
      # Cookie 不写入 metadata_json、不落库、不进入事件 payload，也不会写入下游请求体。
      enabled: ${FINANCEEX_AGENT_RUNTIME_FORWARD_COOKIE_ENABLED:true}
      max-length: ${FINANCEEX_AGENT_RUNTIME_FORWARD_COOKIE_MAX_LENGTH:8192}
      allowed-adapters: ${FINANCEEX_AGENT_RUNTIME_FORWARD_COOKIE_ALLOWED_ADAPTERS:relay-stream-http,relay-websocket}
  storage:
    provider: ${FINANCEEX_STORAGE_PROVIDER:}
    local-path: ${java.io.tmpdir}/financeex-docs
    huawei-s3:
      bucket: ${FINANCEEX_HUAWEI_S3_BUCKET:}
      endpoint: ${FINANCEEX_HUAWEI_S3_ENDPOINT:}
      access-key: ${FINANCEEX_HUAWEI_S3_ACCESS_KEY:}
      secret-key: ${FINANCEEX_HUAWEI_S3_SECRET_KEY:}
      path-style-access-enabled: ${FINANCEEX_HUAWEI_S3_PATH_STYLE_ACCESS_ENABLED:false}
      key-prefix: ${FINANCEEX_HUAWEI_S3_KEY_PREFIX:documents}
      max-connections: ${FINANCEEX_HUAWEI_S3_MAX_CONNECTIONS:200}
      connection-timeout-ms: ${FINANCEEX_HUAWEI_S3_CONNECTION_TIMEOUT_MS:10000}
      socket-timeout-ms: ${FINANCEEX_HUAWEI_S3_SOCKET_TIMEOUT_MS:30000}
    api-store:
      base-url: ${FINANCEEX_API_STORE_BASE_URL:}
      upload-path: ${FINANCEEX_API_STORE_UPLOAD_PATH:/fina/agent/fileOperate/upload}
      timeout: ${FINANCEEX_API_STORE_TIMEOUT:30s}
      forward-cookie: ${FINANCEEX_API_STORE_FORWARD_COOKIE_ENABLED:false}
  document:
    max-upload-size-bytes: ${FINANCEEX_DOCUMENT_MAX_UPLOAD_SIZE_BYTES:52428800}
    # 文档上传入口 Cookie 最大长度；只供配置 forward-cookie=true 的 api-store 使用。
    forward-cookie-max-length: ${FINANCEEX_DOCUMENT_FORWARD_COOKIE_MAX_LENGTH:8192}
  share:
    # 前端分享页地址前缀，发送 provider 会直接拼接 shareId，例如 https://finex.example.com/share/ + share_xxx。
    share-url-prefix: ${FINANCEEX_SHARE_URL_PREFIX:}
    delivery:
      content-max-length: ${FINANCEEX_SHARE_DELIVERY_CONTENT_MAX_LENGTH:200}
      max-targets: ${FINANCEEX_SHARE_DELIVERY_MAX_TARGETS:100}
      # 分享发送入口 Cookie 最大透传长度；仅 WeLink 等显式支持 Cookie 的 provider 使用，不进入请求体和发送记录。
      forward-cookie-max-length: ${FINANCEEX_SHARE_DELIVERY_FORWARD_COOKIE_MAX_LENGTH:8192}
      # 当前 JVM 内分享发送 provider 调用并发上限，避免外部系统抖动时占满异步工作线程。
      max-concurrency: ${FINANCEEX_SHARE_DELIVERY_MAX_CONCURRENCY:20}
      providers:
        welink:
          enabled: ${FINANCEEX_SHARE_WELINK_ENABLED:false}
          base-url: ${FINANCEEX_SHARE_WELINK_BASE_URL:}
          # WeLink 要求的 Referer；为空时使用 base-url。
          referer: ${FINANCEEX_SHARE_WELINK_REFERER:${FINANCEEX_SHARE_WELINK_BASE_URL:}}
          send-path: ${FINANCEEX_SHARE_WELINK_SEND_PATH:}
          timeout: ${FINANCEEX_SHARE_WELINK_TIMEOUT:5s}
          # WeLink 调用失败后的最大重试次数；不包含首次调用，运行时最多按 10 次生效。
          max-retries: ${FINANCEEX_SHARE_WELINK_MAX_RETRIES:3}
          success-status-field: ${FINANCEEX_SHARE_WELINK_SUCCESS_STATUS_FIELD:status}
          success-status-value: ${FINANCEEX_SHARE_WELINK_SUCCESS_STATUS_VALUE:200}
  domain-agent:
    # 仅用于 targetType=DOMAIN_AGENT 的财经领域 DomainAgent 直连调用路径；默认关闭。
    enabled: ${FINANCEEX_DOMAIN_AGENT_ENABLED:false}
    base-url: ${FINANCEEX_DOMAIN_AGENT_BASE_URL:}
    chat-path: ${FINANCEEX_DOMAIN_AGENT_CHAT_PATH:/api/chat}
    stop-path: ${FINANCEEX_DOMAIN_AGENT_STOP_PATH:}
    timeout: ${FINANCEEX_DOMAIN_AGENT_TIMEOUT:120s}
    max-attachments: ${FINANCEEX_DOMAIN_AGENT_MAX_ATTACHMENTS:10}
    # 只缓存尚未完成的单个 DomainAgent frame；超过限制会输出小型诊断事件并丢弃该 frame，避免 OOM。
    max-pending-frame-bytes: ${FINANCEEX_DOMAIN_AGENT_MAX_PENDING_FRAME_BYTES:1048576}
    # diyCardScene/searchList/sourcesDocuments/processResult 等大对象按 fragment payload 输出时的单片大小。
    max-fragment-bytes: ${FINANCEEX_DOMAIN_AGENT_MAX_FRAGMENT_BYTES:8192}
