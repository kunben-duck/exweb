server:
  port: 8080

spring:
  application:
    name: FinanceEXChatService
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${FINANCEEX_DB_URL:jdbc:postgresql://localhost:5432/financeex?currentSchema=${FINANCEEX_DB_SCHEMA:supervisor_dev}}
    username: ${FINANCEEX_DB_USERNAME:fin_supervisor}
    password: ${FINANCEEX_DB_PASSWORD:kunone123}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: ${FINANCEEX_DB_SCHEMA:supervisor_dev}
      maximum-pool-size: ${FINANCEEX_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${FINANCEEX_DB_MIN_IDLE:0}
      connection-timeout: ${FINANCEEX_DB_CONNECTION_TIMEOUT:500}
      initialization-fail-timeout: ${FINANCEEX_DB_INITIALIZATION_FAIL_TIMEOUT:-1}
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
management:
  health:
    db:
      enabled: ${FINANCEEX_DB_HEALTH_ENABLED:false}
    redis:
      enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

financeex:
  redis:
    # Redis 只作为热缓存、取消标记、read cursor 和跨实例实时 fanout，不作为事实源。
    # standalone 用于本地开发；生产 Redis Cluster 设置 FINANCEEX_REDIS_MODE=cluster 并配置 cluster.nodes。
    mode: ${FINANCEEX_REDIS_MODE:standalone}
    host: ${FINANCEEX_REDIS_HOST:localhost}
    port: ${FINANCEEX_REDIS_PORT:6379}
    database: ${FINANCEEX_REDIS_DATABASE:0}
    password: ${FINANCEEX_REDIS_PASSWORD:kunone123}
    timeout: ${FINANCEEX_REDIS_TIMEOUT:500ms}
    connect-timeout: ${FINANCEEX_REDIS_CONNECT_TIMEOUT:500ms}
    cluster:
      # 逗号分隔，例如：10.0.0.1:6379,10.0.0.2:6379,10.0.0.3:6379
      nodes: ${FINANCEEX_REDIS_CLUSTER_NODES:}
      max-redirects: ${FINANCEEX_REDIS_CLUSTER_MAX_REDIRECTS:3}
      topology-refresh-period: ${FINANCEEX_REDIS_CLUSTER_TOPOLOGY_REFRESH_PERIOD:30s}
      adaptive-refresh-enabled: ${FINANCEEX_REDIS_CLUSTER_ADAPTIVE_REFRESH_ENABLED:true}
  security:
    dev:
      # 本地开发态用配置模拟企业权限上下文；接口层不再接收前端传入的 tenantId/userId。
      # 身份信息不提供默认值，缺失时 AuthContextProvider 会直接拒绝请求。
      # 后续接入统一权限框架时，替换 AuthContextProvider 实现即可，业务编排不需要调整。
      tenant-id: ${FINANCEEX_DEV_TENANT_ID:}
      user-id: ${FINANCEEX_DEV_USER_ID:}
      username: ${FINANCEEX_DEV_USERNAME:}
  intent:
    # v3 中意图服务只是可选路由信号，默认关闭；关闭时首轮请求不会调用该 HTTP API。
    enabled: ${FINANCEEX_INTENT_ENABLED:false}
    base-url: ${FINANCEEX_INTENT_BASE_URL:http://localhost:9200}
    recognize-path: ${FINANCEEX_INTENT_RECOGNIZE_PATH:/v1/intents/recognize}
    timeout: 5s
  use-case-library:
    # v3 中用例库只是可选路由信号，默认关闭；关闭时首轮请求不会调用该 HTTP API。
    enabled: ${FINANCEEX_USE_CASE_LIBRARY_ENABLED:false}
    min-score: 0.85
    base-url: ${FINANCEEX_USE_CASE_LIBRARY_BASE_URL:http://localhost:9100}
    match-path: ${FINANCEEX_USE_CASE_LIBRARY_MATCH_PATH:/v1/use-cases/match}
    timeout: 5s
  runtime-binding:
    ttl: 3d
    redis-key-prefix: fin_ex:runtime_binding
    redis-ttl: 3d
  chat-run:
    active-key-prefix: fin_ex:chat_run:active
    cancel-key-prefix: fin_ex:chat_run:cancel
    active-ttl: 6h
    cancel-ttl: 1h
  chat-read-cursor:
    redis-key-prefix: fin_ex:chat_read_cursor
    redis-ttl: 7d
    database-flush-interval: 5s
  websocket:
    # WebSocket 是用户级连接，事件按 run 级 stream topic 订阅；Redis Pub/Sub 只做跨实例实时扇出。
    # 前端 WS 入口同时支持 WebFlux 与 Servlet/MVC；Servlet 模式的上下文根使用 server.servlet.context-path。
    redis-channel-prefix: fin_ex:chat_stream
  sub-agent:
    timeout: 30s
    agents:
      employee_reimbursement_agent:
        enabled: ${FINANCEEX_EMPLOYEE_REIMBURSEMENT_AGENT_ENABLED:true}
        endpoint: ${FINANCEEX_EMPLOYEE_REIMBURSEMENT_AGENT_ENDPOINT:}
        stop-endpoint: ${FINANCEEX_EMPLOYEE_REIMBURSEMENT_AGENT_STOP_ENDPOINT:}
  memory:
    short-term:
      enabled: ${FINANCEEX_MEMORY_SHORT_TERM_ENABLED:false}
      recent-turns: ${FINANCEEX_MEMORY_SHORT_TERM_RECENT_TURNS:5}
      cache-enabled: ${FINANCEEX_MEMORY_SHORT_TERM_CACHE_ENABLED:true}
      redis-key-prefix: fin_ex:memory:short_term
      ttl: 3d
      max-cached-messages: 200
      failure-backoff: 30s
      storage:
        database-required: ${FINANCEEX_SHORT_TERM_DB_REQUIRED:true}
        database-failure-backoff: 30s
    long-term:
      enabled: ${FINANCEEX_MEMORY_LONG_TERM_ENABLED:false}
      provider: ${FINANCEEX_MEMORY_LONG_TERM_PROVIDER:disabled}
      top-k: ${FINANCEEX_MEMORY_LONG_TERM_TOP_K:5}
  agent-runtime:
    # AgentRuntime 防腐层类型。当前内置 relay；后续替换 Runtime 时新增 provider，不把协议写进 provider。
    provider: ${FINANCEEX_AGENT_RUNTIME_PROVIDER:relay}
    # Relay API 接入协议 adapter。relay-stream-http=真实 Relay HTTP；deepseek-chat-completions=DeepSeek 替身；relay-websocket=Relay 出站 WebSocket。
    api-adapter: ${FINANCEEX_RELAY_AGENT_API_ADAPTER:relay-stream-http}
    base-url: ${FINANCEEX_RELAY_AGENT_BASE_URL:http://localhost:9000}
    stream-path: ${FINANCEEX_RELAY_AGENT_STREAM_PATH:/v1/agent/runs/stream}
    stop-path: ${FINANCEEX_RELAY_AGENT_STOP_PATH:/v1/agent/runs/{runId}/stop}
    websocket-path: ${FINANCEEX_RELAY_AGENT_WEBSOCKET_PATH:/v1/agent/runs/ws}
    api-key: ${FINANCEEX_RELAY_AGENT_API_KEY:${DEEPSEEK_API_KEY:}}
    model: ${FINANCEEX_RELAY_AGENT_MODEL:deepseek-v4-pro}
    system-prompt: ${FINANCEEX_RELAY_AGENT_SYSTEM_PROMPT:You are a helpful assistant.}
    stream: ${FINANCEEX_RELAY_AGENT_STREAM:true}
    thinking-enabled: ${FINANCEEX_RELAY_AGENT_THINKING_ENABLED:false}
    reasoning-effort: ${FINANCEEX_RELAY_AGENT_REASONING_EFFORT:}
    cancel-supported: ${FINANCEEX_RELAY_AGENT_CANCEL_SUPPORTED:true}
    timeout: 60s
  storage:
    provider: ${FINANCEEX_STORAGE_PROVIDER:local}
    local-path: ${java.io.tmpdir}/financeex-docs
    huawei-s3:
      bucket: ${FINANCEEX_HUAWEI_S3_BUCKET:}
      endpoint: ${FINANCEEX_HUAWEI_S3_ENDPOINT:}
      access-key: ${FINANCEEX_HUAWEI_S3_ACCESS_KEY:}
      secret-key: ${FINANCEEX_HUAWEI_S3_SECRET_KEY:}
      path-style-access-enabled: ${FINANCEEX_HUAWEI_S3_PATH_STYLE_ACCESS_ENABLED:false}
      key-prefix: ${FINANCEEX_HUAWEI_S3_KEY_PREFIX:documents}
      max-connections: ${FINANCEEX_HUAWEI_S3_MAX_CONNECTIONS:200}
      connection-timeout-ms: ${FINANCEEX_HUAWEI_S3_CONNECTION_TIMEOUT_MS:10000}
      socket-timeout-ms: ${FINANCEEX_HUAWEI_S3_SOCKET_TIMEOUT_MS:30000}
